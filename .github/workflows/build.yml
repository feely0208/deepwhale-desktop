name: Build

on:
  push:
    branches: [main]
    # 纯文档/主页改动不需要跑三平台 Electron 打包（Pages 工作流只发布 docs/）
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + assets)
        run: npm run build

      - name: Package
        # CI 只做构建校验，不发布（--publish never；正式发布走 release.yml）
        run: npm run dist -- --publish never
        env:
          # 未配置签名时跳过签名，仅产出未签名包（后续接 Apple/Windows 证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
