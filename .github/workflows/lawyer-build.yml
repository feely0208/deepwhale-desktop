# 深鲸律师端 · 构建 Windows / Linux / macOS 安装包
# - 在各平台原生环境构建（无需 wine）
# - 构建后上传为 Actions Artifact，供手动下载后 `gh release upload` 到发布
# - 触发：推送 lawyer/** 自动构建，或手动 workflow_dispatch
# - macOS：仓库没有 Apple 开发者证书，所以 `lawyer/package.json` 里写死 `mac.identity: '-'`（显式 ad-hoc 签名），
#   electron-builder 会把整个 .app（含 Resources）打上有效封印。**只设 CSC_IDENTITY_AUTO_DISCOVERY=false
#   而没有 identity 会得到「只有 linker 签名」的坏包**（codesign --verify 报 code has no resources but
#   signature indicates they must be present），用户从浏览器下载后打不开 —— 所以 job 里带一步签名校验，
#   坏包不让上传。
# - electron：钉成精确版本（package.json 里是 43.4.0）。真正的病根是 `lawyer/node_modules` 里**没有 electron**
#   ——electron-builder 这时会回落到 package.json 的版本声明并报
#   "Electron version \"^43.4.0\" is a range, not a fixed version … a range cannot be resolved without
#   electron installed in node_modules"（本机已复现）。所以：①锁文件必须能在干净 checkout 上 `npm ci` 装上
#   electron；②版本钉精确作为兜底（有本地 electron 时区间也能构建成功，钉版是防御而非唯一解）。
name: Build Lawyer (Win/Linux/macOS)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'lawyer/**'
      - '.github/workflows/lawyer-build.yml'

permissions:
  contents: read

jobs:
  build-mac:
    name: 构建 macOS (zip, ad-hoc 签名)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: lawyer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - name: 安装依赖
        run: npm ci

      # ⛔ 免核验后门检查（命中即拒绝出包）
      #    曾经有一段「姓名填 feely/张冬宝 + 任意 17 位数字就直接登录」的特权代码
      #    混进了正式包 —— 注释声称"release 构建由开关关闭"，但仓库里根本没有那个开关，
      #    构建不做任何替换。后果：① 任何人填这两个名字即可免核验使用；
      #    ② 正常测试路径被废掉 —— 点"提交审核"根本没走后台，运营侧收不到申请，
      #    而客户端直接进了工作台（2026-09-29 用户实测）。
      - name: 实名核验后门检查（命中即拒绝出包）
        working-directory: .
        run: node scripts/check-lawyer-verify-gate.js

      # ⛔ 生产包不得出现开发者工具入口。
      #    实测（2026-09-29）：用户在律师端按 Ctrl+Shift+I 直接打开了开发者工具，
      #    能改 localStorage 里的核验记录 —— 等于绕过实名核验。
      - name: 开发者工具入口检查（命中即拒绝出包）
        working-directory: .
        run: node scripts/check-no-devtools-in-prod.js

      # 两个架构都要出：Intel Mac 用户同样需要律师端。
      # electron-builder 的默认输出目录是 dist/mac（x64）与 dist/mac-arm64（arm64）。
      - name: 构建 macOS zip（arm64 + x64）
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ⚠️ electron-builder 的输出目录名不统一：**arm64 是 dist/mac-arm64，
      # 但 x64 是 dist/mac**（不是 dist/mac-x64）。按 `dist/mac-${ARCH}` 拼会在
      # x64 上找不到 .app —— 实测会打出一个**内容为空的 zip**（构建却照样成功）。
      - name: 校验 ad-hoc 签名与 entitlements（坏包不许出门）
        run: |
          set -e
          for ARCH in arm64 x64; do
            case "$ARCH" in
              arm64) APPDIR="dist/mac-arm64" ;;
              x64)   APPDIR="dist/mac" ;;
            esac
            APP=$(find "$APPDIR" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$APP" || { echo "❌ $ARCH: $APPDIR 下找不到 .app"; exit 1; }
            echo "---- $ARCH: $APP ----"
            codesign -dvvv "$APP" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier|flags)=' || true
            codesign --verify --strict "$APP"
            codesign -dvvv "$APP" 2>&1 | grep -q 'Signature=adhoc'
            codesign -dvvv "$APP" 2>&1 | grep -q 'flags=.*adhoc'
            codesign -d --entitlements - "$APP" 2>&1 | grep -q 'disable-library-validation'
            echo "✅ $ARCH ad-hoc 封印 + disable-library-validation 校验通过"
          done

      - name: 打成「首次使用」zip（两个架构各一份，与站点命名一致）
        # 站点上那份 zip 的顶层是「深鲸·律师端-首次使用/」，里面是 .app + 「首次使用请双击我.command」
        # （双击助手会 xattr -dr com.apple.quarantine 并 open，省得用户自己敲命令）。
        # 这一步把 electron-builder 的裸 zip 换成同一形态，CI 产物才等于可直接发布的资产。
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          for ARCH in arm64 x64; do
            case "$ARCH" in
              arm64) APPDIR="dist/mac-arm64" ;;
              x64)   APPDIR="dist/mac" ;;
            esac
            APP=$(find "$APPDIR" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$APP" || { echo "❌ $ARCH: $APPDIR 下找不到 .app"; exit 1; }
            OUT="dist/深鲸·律师端-首次使用-${ARCH}"
            ZIP="dist/DeepWhale-Lawyer-${VER}-${ARCH}.zip"
            rm -rf "$OUT" "$ZIP"
            mkdir -p "$OUT"
            cp -R "$APP" "$OUT/"
            cp "build/首次使用请双击我.command" "$OUT/"
            chmod +x "$OUT/首次使用请双击我.command"
            # 用 ditto 而不是 zip/python：--sequesterRsrc 会保留符号链接与扩展属性，
            # 而 .app 的 Frameworks 里大量是符号链接，换成会解引用符号链接的打包器
            # 打出来的 app 直接是坏的（体积暴涨且签名失效）。
            ditto -c -k --sequesterRsrc --keepParent "$OUT" "$ZIP"
            rm -rf "$OUT"
            ls -lh "$ZIP"
            # 断言 zip 里真的装了 app —— 空 zip 是最难发现的一类坏包。
            # 用 python3 的 zipfile 直接读中央目录，而不是 `unzip -l`：ditto 打的
            # zip 不带 UTF-8 标志，中文名交给 unzip 渲染时结果随版本/区域设置而变，
            # CI 上曾因此把 133MB 的完整包误判成「没有 app 内容」。
            COUNT=$(python3 -c "import sys,zipfile;print(sum(1 for n in zipfile.ZipFile(sys.argv[1]).namelist() if 'Contents/MacOS/' in n))" "$ZIP")
            if [ "$COUNT" -lt 1 ]; then
              echo "❌ $ZIP 里没有 app 内容（Contents/MacOS/ 条目数 = $COUNT）"
              echo "---- zip 实际条目（解码失败以 ? 显示）----"
              python3 -c "import sys,zipfile;[print('   ',repr(n)) for n in zipfile.ZipFile(sys.argv[1]).namelist()[:10]]" "$ZIP" || true
              exit 1
            fi
            # 再兜一道体积下限：条目数对但内容被截断（例如中途 OOM）也要拦住
            SIZE=$(stat -f%z "$ZIP")
            test "$SIZE" -ge 50000000 || { echo "❌ $ZIP 仅 $SIZE 字节，明显不完整"; exit 1; }
            echo "✅ ${ZIP##*/} —— $COUNT 条 app 条目，$((SIZE/1048576)) MB"
          done
          rm -f dist/*.blockmap dist/builder-debug.yml

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-mac
          # ⚠️ 2026-10-03 修：必须带上更新清单 lawyer-latest-mac.yml 和 dmg。
          #    原来只有 *.zip —— 于是 Release 里没有清单，sync-downloads 拉不到，
          #    CDN 上的 lawyer-latest-mac.yml 永远停在手工补传的那一版，
          #    用户那份律师端永远发现不了新版本（0.1.9 就这么卡住的）。
          path: |
            lawyer/dist/*.zip
            lawyer/dist/*.dmg
            lawyer/dist/lawyer-latest*.yml
          if-no-files-found: error

  build-win:
    name: 构建 Windows (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lawyer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - name: 安装依赖
        run: npm ci

      # ⛔ 免核验后门检查（命中即拒绝出包）
      #    曾经有一段「姓名填 feely/张冬宝 + 任意 17 位数字就直接登录」的特权代码
      #    混进了正式包 —— 注释声称"release 构建由开关关闭"，但仓库里根本没有那个开关，
      #    构建不做任何替换。后果：① 任何人填这两个名字即可免核验使用；
      #    ② 正常测试路径被废掉 —— 点"提交审核"根本没走后台，运营侧收不到申请，
      #    而客户端直接进了工作台（2026-09-29 用户实测）。
      - name: 实名核验后门检查（命中即拒绝出包）
        working-directory: .
        run: node scripts/check-lawyer-verify-gate.js

      # ⛔ 生产包不得出现开发者工具入口。
      #    实测（2026-09-29）：用户在律师端按 Ctrl+Shift+I 直接打开了开发者工具，
      #    能改 localStorage 里的核验记录 —— 等于绕过实名核验。
      - name: 开发者工具入口检查（命中即拒绝出包）
        working-directory: .
        run: node scripts/check-no-devtools-in-prod.js

      - name: 短信说明（短信由华为云服务器发送，App 不含密钥）
        shell: bash
        run: echo "短信由服务器发送，App 不打包 sms-config.json（无密钥）"

      - name: 构建 NSIS 安装包
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-win
          path: |
            lawyer/dist/*.exe
            lawyer/dist/*.blockmap
          if-no-files-found: error

  build-linux:
    name: 构建 Linux (AppImage + deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lawyer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - name: 安装依赖
        run: npm ci

      # ⛔ 免核验后门检查（命中即拒绝出包）
      #    曾经有一段「姓名填 feely/张冬宝 + 任意 17 位数字就直接登录」的特权代码
      #    混进了正式包 —— 注释声称"release 构建由开关关闭"，但仓库里根本没有那个开关，
      #    构建不做任何替换。后果：① 任何人填这两个名字即可免核验使用；
      #    ② 正常测试路径被废掉 —— 点"提交审核"根本没走后台，运营侧收不到申请，
      #    而客户端直接进了工作台（2026-09-29 用户实测）。
      - name: 实名核验后门检查（命中即拒绝出包）
        working-directory: .
        run: node scripts/check-lawyer-verify-gate.js

      # ⛔ 生产包不得出现开发者工具入口。
      #    实测（2026-09-29）：用户在律师端按 Ctrl+Shift+I 直接打开了开发者工具，
      #    能改 localStorage 里的核验记录 —— 等于绕过实名核验。
      - name: 开发者工具入口检查（命中即拒绝出包）
        working-directory: .
        run: node scripts/check-no-devtools-in-prod.js

      - name: 短信说明（短信由华为云服务器发送，App 不含密钥）
        shell: bash
        run: echo "短信由服务器发送，App 不打包 sms-config.json（无密钥）"

      - name: 构建 AppImage + deb
        run: npx electron-builder --linux --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-linux
          path: |
            lawyer/dist/*.AppImage
            lawyer/dist/*.deb
          if-no-files-found: error

  # ── 汇总三平台产物并创建 Draft Release ─────────────────────────────
  #
  # 为什么加这一步：原来这个工作流只产出 Actions Artifact，发版要人工
  # 「下载产物 → gh release upload」，既慢又容易漏平台（历史上就漏过 arm64）。
  # 这里直接在 CI 内汇总并建 **Draft**：沿用 release.yml 的既有约定 ——
  # 草稿需要人工确认后才公开，不会自动对外发布。
  #
  # 标签用 `lawyer-v<version>`，与壳的 `v<version>` 区分开，互不干扰：
  # 壳的自动更新读的是 GitHub 的 Latest，律师端不使用该通道。
  release:
    name: 汇总三平台产物并发布（预发布）
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      # 需要显式触发 sync-downloads（见文件末尾那一步）
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 校验三平台产物齐备（缺一个都不许出门）
        run: |
          set -e
          fail=0
          for p in mac win linux; do
            n=$(find "artifacts/lawyer-$p" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "lawyer-$p: $n 个文件"
            if [ "$n" -eq 0 ]; then echo "❌ lawyer-$p 没有产物"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "--- 全部产物 ---"
          find artifacts -type f | sort

      - name: 推送标签
        run: |
          set -e
          VER=$(node -p "require('./lawyer/package.json').version")
          TAG="lawyer-v$VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "标签 $TAG 已存在，跳过"
          else
            git tag -a "$TAG" -m "深鲸·律师端 v$VER"
            git push origin "$TAG"
            echo "已推送标签 $TAG"
          fi

      - name: 创建或更新 Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./lawyer/package.json').version")
          TAG="lawyer-v$VER"
          echo "律师端版本 $VER → 标签 $TAG"
          mapfile -t FILES < <(find artifacts -type f | sort)
          echo "待上传 ${#FILES[@]} 个文件"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 追加/覆盖资产，并确保为预发布"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            # 已存在时也要落到「预发布且非草稿」，否则：
            #   · 停在草稿 → sync-downloads 不触发，CDN 拿不到新包
            #   · 变成正式 → 抢占仓库的 Latest，壳的 electron-updater 会去拉这个
            #     Release，而它没有壳的产物 → 自动更新失败（套装当年踩过同样的坑）
            gh release edit "$TAG" --draft=false --prerelease=true
          else
            gh release create "$TAG" "${FILES[@]}" \
              --prerelease \
              --title "深鲸·律师端 v$VER" \
              --notes "深鲸·律师端 v$VER（法律版，需激活）

          ## 下载
          - macOS（Apple Silicon）：\`DeepWhale-Lawyer-$VER-arm64.zip\`
          - macOS（Intel）：\`DeepWhale-Lawyer-$VER-x64.zip\`
          - Windows x64：\`DeepWhale-Lawyer-$VER-x64-Setup.exe\`
          - Linux：\`DeepWhale-Lawyer-$VER-x86_64.AppImage\` / \`DeepWhale-Lawyer-$VER-x86_64.deb\`

          > 装完务必先打开一次律师端并完成激活：\`deepwhale-law\` 链接协议是律师端
          > 首次运行时才向系统登记的，只装不开则不会登记，深鲸桌面里选「法律模式」会找不到律师端。

          ⚠️ 本 Release 必须是 **Pre-release**：一旦成为正式版，它会抢占仓库的 Latest，
          壳的 electron-updater 会去拉这个 Release，而这里没有壳的产物 → 自动更新失败。
          （套装当年踩过同样的坑，见 RELEASING.md。）"
          fi
          echo "✔ 完成：$TAG"

      # 自检：断言 Release 真的建出来了、资产真的传上去了。
      # 没有这一步时，作业报 "success" 但其实什么都没建出来也无从发现 ——
      # 「没有报错」不等于「事情做成了」。
      - name: 校验 Release 与资产齐备（fail-loud）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./lawyer/package.json').version")
          TAG="lawyer-v$VER"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets > /tmp/rel.json
          echo "--- Release 实际内容 ---"
          cat /tmp/rel.json
          echo ""
          EXPECT_TAG="$TAG" node -e '
            const r = require("/tmp/rel.json");
            const n = (r.assets || []).length;
            const fail = (m) => { console.error("❌ " + m); process.exit(1); };
            if (r.tagName !== process.env.EXPECT_TAG) fail("标签不符：期望 " + process.env.EXPECT_TAG + "，实际 " + r.tagName);
            if (n === 0) fail("Release 建出来了，但一个资产都没有");
            if (r.isDraft) fail("Release 仍是草稿：sync-downloads 不会触发，CDN 拿不到新包");
            if (!r.isPrerelease) fail("Release 不是预发布：会抢占仓库 Latest，导致壳的自动更新去拉它而失败");
            console.log("✅ " + r.tagName + " 存在，草稿=" + r.isDraft + "，预发布=" + r.isPrerelease + "，资产 " + n + " 个");
          '

      # 🔴 必须显式触发 CDN 同步 —— 不能指望 `release: published` 自动生效。
      #
      # GitHub 的机制：**用 GITHUB_TOKEN 触发的事件不会再触发其它工作流**
      # （防止递归调用）。所以上面用 secrets.GITHUB_TOKEN 发布 Release 时，
      # sync-downloads.yml 的 `on: release: types: [published]` 是个哑炮 ——
      # Release 建出来了，CDN 却永远拿不到文件，而两边都报成功。
      # 2026-09-27 实测踩到：lawyer-v0.1.2 已发布，但 dl.deepwhale.org.cn 全部 403。
      #
      # workflow_dispatch 是这个限制的例外，可以显式调用，所以在这里补一刀。
      - name: 触发 CDN 同步（sync-downloads）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./lawyer/package.json').version")
          TAG="lawyer-v$VER"
          gh workflow run sync-downloads.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
          echo "已触发 sync-downloads：$TAG"
          echo "（该工作流会把 DeepWhale-Lawyer-* 同步到 OBS，随后经 CDN 对外）"
