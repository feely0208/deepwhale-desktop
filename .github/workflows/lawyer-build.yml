# 深鲸律师端 · 构建 Windows / Linux / macOS 安装包
# - 在各平台原生环境构建（无需 wine）
# - 构建后上传为 Actions Artifact，供手动下载后 `gh release upload` 到发布
# - 触发：推送 lawyer/** 自动构建，或手动 workflow_dispatch
# - macOS：仓库没有 Apple 开发者证书，所以 `lawyer/package.json` 里写死 `mac.identity: '-'`（显式 ad-hoc 签名），
#   electron-builder 会把整个 .app（含 Resources）打上有效封印。**只设 CSC_IDENTITY_AUTO_DISCOVERY=false
#   而没有 identity 会得到「只有 linker 签名」的坏包**（codesign --verify 报 code has no resources but
#   signature indicates they must be present），用户从浏览器下载后打不开 —— 所以 job 里带一步签名校验，
#   坏包不让上传。
# - electron：钉成精确版本（package.json 里是 43.4.0）。真正的病根是 `lawyer/node_modules` 里**没有 electron**
#   ——electron-builder 这时会回落到 package.json 的版本声明并报
#   "Electron version \"^43.4.0\" is a range, not a fixed version … a range cannot be resolved without
#   electron installed in node_modules"（本机已复现）。所以：①锁文件必须能在干净 checkout 上 `npm ci` 装上
#   electron；②版本钉精确作为兜底（有本地 electron 时区间也能构建成功，钉版是防御而非唯一解）。
name: Build Lawyer (Win/Linux/macOS)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'lawyer/**'
      - '.github/workflows/lawyer-build.yml'

permissions:
  contents: read

jobs:
  build-mac:
    name: 构建 macOS (zip, ad-hoc 签名)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: lawyer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 两个架构都要出：Intel Mac 用户同样需要律师端。
      # electron-builder 的默认输出目录是 dist/mac（x64）与 dist/mac-arm64（arm64）。
      - name: 构建 macOS zip（arm64 + x64）
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # ⚠️ electron-builder 的输出目录名不统一：**arm64 是 dist/mac-arm64，
      # 但 x64 是 dist/mac**（不是 dist/mac-x64）。按 `dist/mac-${ARCH}` 拼会在
      # x64 上找不到 .app —— 实测会打出一个**内容为空的 zip**（构建却照样成功）。
      - name: 校验 ad-hoc 签名与 entitlements（坏包不许出门）
        run: |
          set -e
          for ARCH in arm64 x64; do
            case "$ARCH" in
              arm64) APPDIR="dist/mac-arm64" ;;
              x64)   APPDIR="dist/mac" ;;
            esac
            APP=$(find "$APPDIR" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$APP" || { echo "❌ $ARCH: $APPDIR 下找不到 .app"; exit 1; }
            echo "---- $ARCH: $APP ----"
            codesign -dvvv "$APP" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier|flags)=' || true
            codesign --verify --strict "$APP"
            codesign -dvvv "$APP" 2>&1 | grep -q 'Signature=adhoc'
            codesign -dvvv "$APP" 2>&1 | grep -q 'flags=.*adhoc'
            codesign -d --entitlements - "$APP" 2>&1 | grep -q 'disable-library-validation'
            echo "✅ $ARCH ad-hoc 封印 + disable-library-validation 校验通过"
          done

      - name: 打成「首次使用」zip（两个架构各一份，与站点命名一致）
        # 站点上那份 zip 的顶层是「深鲸·律师端-首次使用/」，里面是 .app + 「首次使用请双击我.command」
        # （双击助手会 xattr -dr com.apple.quarantine 并 open，省得用户自己敲命令）。
        # 这一步把 electron-builder 的裸 zip 换成同一形态，CI 产物才等于可直接发布的资产。
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          for ARCH in arm64 x64; do
            case "$ARCH" in
              arm64) APPDIR="dist/mac-arm64" ;;
              x64)   APPDIR="dist/mac" ;;
            esac
            APP=$(find "$APPDIR" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$APP" || { echo "❌ $ARCH: $APPDIR 下找不到 .app"; exit 1; }
            OUT="dist/深鲸·律师端-首次使用-${ARCH}"
            ZIP="dist/DeepWhale-Lawyer-${VER}-${ARCH}.zip"
            rm -rf "$OUT" "$ZIP"
            mkdir -p "$OUT"
            cp -R "$APP" "$OUT/"
            cp "build/首次使用请双击我.command" "$OUT/"
            chmod +x "$OUT/首次使用请双击我.command"
            # 用 ditto 而不是 zip/python：--sequesterRsrc 会保留符号链接与扩展属性，
            # 而 .app 的 Frameworks 里大量是符号链接，换成会解引用符号链接的打包器
            # 打出来的 app 直接是坏的（体积暴涨且签名失效）。
            ditto -c -k --sequesterRsrc --keepParent "$OUT" "$ZIP"
            rm -rf "$OUT"
            ls -lh "$ZIP"
            # 断言 zip 里真的装了 app —— 空 zip 是最难发现的一类坏包。
            # 用 python3 的 zipfile 直接读中央目录，而不是 `unzip -l`：ditto 打的
            # zip 不带 UTF-8 标志，中文名交给 unzip 渲染时结果随版本/区域设置而变，
            # CI 上曾因此把 133MB 的完整包误判成「没有 app 内容」。
            COUNT=$(python3 -c "import sys,zipfile;print(sum(1 for n in zipfile.ZipFile(sys.argv[1]).namelist() if 'Contents/MacOS/' in n))" "$ZIP")
            if [ "$COUNT" -lt 1 ]; then
              echo "❌ $ZIP 里没有 app 内容（Contents/MacOS/ 条目数 = $COUNT）"
              echo "---- zip 实际条目（解码失败以 ? 显示）----"
              python3 -c "import sys,zipfile;[print('   ',repr(n)) for n in zipfile.ZipFile(sys.argv[1]).namelist()[:10]]" "$ZIP" || true
              exit 1
            fi
            # 再兜一道体积下限：条目数对但内容被截断（例如中途 OOM）也要拦住
            SIZE=$(stat -f%z "$ZIP")
            test "$SIZE" -ge 50000000 || { echo "❌ $ZIP 仅 $SIZE 字节，明显不完整"; exit 1; }
            echo "✅ ${ZIP##*/} —— $COUNT 条 app 条目，$((SIZE/1048576)) MB"
          done
          rm -f dist/*.blockmap dist/builder-debug.yml

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-mac
          path: |
            lawyer/dist/*.zip
          if-no-files-found: error

  build-win:
    name: 构建 Windows (NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lawyer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 短信说明（短信由华为云服务器发送，App 不含密钥）
        shell: bash
        run: echo "短信由服务器发送，App 不打包 sms-config.json（无密钥）"

      - name: 构建 NSIS 安装包
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-win
          path: |
            lawyer/dist/*.exe
            lawyer/dist/*.blockmap
          if-no-files-found: error

  build-linux:
    name: 构建 Linux (AppImage + deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lawyer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lawyer/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 短信说明（短信由华为云服务器发送，App 不含密钥）
        shell: bash
        run: echo "短信由服务器发送，App 不打包 sms-config.json（无密钥）"

      - name: 构建 AppImage + deb
        run: npx electron-builder --linux --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-linux
          path: |
            lawyer/dist/*.AppImage
            lawyer/dist/*.deb
          if-no-files-found: error
