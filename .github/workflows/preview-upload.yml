# 把某次构建 run 的安装包（Win + mac）补传到 CDN 的 preview/ 目录，供国内真机验证。
# 只传安装包，不传 latest*.yml —— 绝不影响正式用户的更新检查。
name: Preview Upload

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '要补传的 Release 构建 run id'
        required: true
      version:
        description: '预览目录版本号（如 1.0.63）'
        required: true
        default: '1.0.63'
      include_mac:
        description: '是否包含 macOS 产物'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载构建产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir artifacts
          find artifacts -type f | sort | head -40

      - name: 挑选安装包并同步到 CDN
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
        run: |
          set -e
          if [ -z "$OBS_AK" ]; then echo "::warning::未配置 OBS_AK，跳过"; exit 0; fi
          mkdir -p preview-out
          include_mac="${{ inputs.include_mac }}"
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            case "$base" in
              *x64-Setup.exe|*arm64.dmg|*x64.dmg) cp "$f" preview-out/ ;;
              *) echo "skip $base" ;;
            esac
          done
          if [ "$include_mac" != "true" ]; then rm -f preview-out/*.dmg; fi
          ls -lh preview-out
          npm install --no-save --no-audit --no-fund esdk-obs-nodejs >/dev/null 2>&1 || true
          node scripts/sync-to-obs.js --dir preview-out --key-prefix "preview/${{ inputs.version }}" --concurrency 4 --no-exclude
