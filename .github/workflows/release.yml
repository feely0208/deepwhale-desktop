# 发布工作流：推送 v* 标签 → 三平台打包 → 汇总上传到 GitHub Releases（Draft，人工确认后公开）
# 说明：
#   - 三平台只负责构建（--publish never），产物以 Actions Artifact 暂存；
#   - 单独的 publish 任务把三平台产物汇总，用 gh release 一次性创建草稿并上传全部附件，
#     避免 electron-builder 并发发布时产生多个草稿 / 附件散落 / 静默跳过发布。
# 详见 RELEASING.md
name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发：只构建、不发布（publish 任务在非 tag 触发时跳过，不同步 CDN）。
  # 用途：发版前的真机验证包（Windows 实机验收就靠它，避免未验证版本推给用户）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ mac 的 arm64 与 x64 必须拆成两个 job：office 载荷里的 CPython 是架构绑定的，
          # 一个 job 只能让 extraResources 指到一份载荷 —— 合在一起会让 Intel 用户拿到
          # arm64 的解释器（装得上、用不了）。矩阵里用 office-target 标明各自要构建哪份。
          #
          # ⚠️ 也正因为拆了，产物名**不能**再用 matrix.os 拼：两个 mac job 的 os 都是
          # macos-latest，会撞成同名 artifact，download-artifact 合并时互相覆盖 ——
          # 实测 v1.0.17 首次发布就因此丢了整个 macOS arm64（只剩 x64），
          # 而两个 job 都是绿的，日志里看不出任何异常。用 key 区分。
          - os: macos-latest
            key: macos-arm64
            args: --mac --arm64
            office-target: darwin-arm64
          - os: macos-latest
            key: macos-x64
            args: --mac --x64
            office-target: darwin-x64
          - os: windows-latest
            key: windows-x64
            args: --win
            office-target: win32-x64
          - os: ubuntu-latest
            key: linux-x64
            args: --linux
            office-target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 发版一致性：版本号/package-lock/两站常量/下载页徽标必须一致（2026-10-21 加）
      - name: 发版一致性守卫（版本号 / package-lock / 两站常量 / 下载页徽标）
        run: node scripts/check-release-consistency.js

      - name: 安装器配置守卫（appId 冻结 / oneClick / 固定目录）
        run: npm run check:installer

      - name: Build (tsc + assets)
        run: npm run build

      # 随包 DSH 运行时：把整套 harness 打进安装包，用户机器无需 Node.js / npx / 联网。
      # 主进程用 Electron 自带 Node（ELECTRON_RUN_AS_NODE）拉起 dsh-runtime/…/dsh/lib/bin.js。
      # 版本**只**写在仓库根目录的 dsh-runtime.version（见 scripts/dsh-runtime-version.js），
      # 这里和 src/main/store.ts 的兜底命令都从它读 —— 以前是两处手抄，抄漏就分裂。
      # 运行时由 electron-builder 打进 asar（见 electron-builder.yml 的 files/asarUnpack），
      # 因此**不再需要**旧的 "先把 node_modules 改名 pkgs、打包后再改回" 的绕行。
      #
      # 镜像源：默认走官方 registry（CI 在境外，速度正常）；本机/境内可用
      #   DSH_NPM_REGISTRY=https://registry.npmmirror.com npm run …
      # 本机实测（2026-09-29）registry.npmjs.org 在此网络下 TLS 握手直接超时，
      # 而 npmmirror 装 0.2.0-rc.2 只要 31 秒 —— 所以必须留这个开关，否则本机没法构建。
      - name: Prepare bundled DSH runtime
        shell: bash
        run: |
          DSH_VERSION=$(node scripts/dsh-runtime-version.js)
          echo "随包 DSH 运行时版本：$DSH_VERSION"
          REGISTRY_ARGS=""
          if [ -n "${DSH_NPM_REGISTRY:-}" ]; then
            REGISTRY_ARGS="--registry=$DSH_NPM_REGISTRY"
            echo "使用镜像源：$DSH_NPM_REGISTRY"
          fi
          npm install "@deepseek-ai/dsh@$DSH_VERSION" --prefix dsh-runtime --no-audit --no-fund --loglevel=error $REGISTRY_ARGS
          test -f dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
          # 装完立刻核对：装到的版本与 dsh-runtime.version 必须一致，
          # 否则会出现「包里是 A 版、兜底命令写 B 版」这种极难查的分裂。
          node scripts/dsh-runtime-version.js --check

          # ── 裁掉运行期用不到的开发产物（实测省约 110MB）────────────────
          # 本机实测（2026-09-27）：
          #   *.map     4,375 个  55.8 MB   source map，只影响堆栈的行号映射
          #   *.d.ts    7,164 个  53.9 MB   TypeScript 声明，只服务编译期
          # 合计约 110MB / 11,000+ 个文件。
          #
          # ⛔ 这里**绝不能裁 `*.md`**（2026-09-28 血的教训）：
          #   当初以为 "947 个 .md 都是依赖自带的文档，运行期不需要"，于是连它一起删。
          #   实际上 dsh-runtime 下有 6 个 SKILL.md 是**运行时按路径读进来的资产**：
          #     · @deepseek-ai/dsh-skill-office/assets/office-{docx,xlsx,pptx}/SKILL.md
          #     · @deepseek-ai/dsh-agent-preset/skills/*/SKILL.md
          #   后果：1.0.19 发出去的包里 dsh-skill-office **激活失败**
          #     「Error: ENOENT … assets/office-docx/SKILL.md not found in app.asar」
          #   —— 办公能力（Word/Excel/PPT）在正式包里直接是坏的，
          #   而安装包本身能启动、法律模式也正常，所以**看起来一切正常**。
          #   教训：`dsh --version` / `--help` 跑通**证明不了**插件能激活。
          #   真正的守门是后面的「随包运行时启动自检」：真起一次、断言没有条目激活失败。
          # .md 总共才 10MB，为了它冒这个险不值得。
          before_files=$(find dsh-runtime -type f | wc -l | tr -d ' ')
          before=$(du -sm dsh-runtime | awk '{print $1}')
          # 裁剪前先记下完整文件清单 —— 事后拿它做"到底删了什么"的断言。
          find dsh-runtime -type f | sort > /tmp/rt-before.txt
          find dsh-runtime \( -name '*.map' -o -name '*.d.ts' -o -name '*.d.ts.map' \) -type f -delete
          find dsh-runtime \( -name '.eslintrc*' -o -name '.prettierrc*' -o -name 'tsconfig.json' -o -name '.editorconfig' \) -type f -delete
          find dsh-runtime -type f | sort > /tmp/rt-after.txt

          # ── 断言：删掉的每一个文件都必须是"预期可删"的那几类 ────────────
          #
          # 为什么是"逐文件核对"而不是"数几个 SKILL.md"：
          # 2026-09-28 出的事故是 `-name '*.md'` 把
          #   @deepseek-ai/dsh-skill-office/assets/office-docx/SKILL.md
          # 这类**运行时按路径读的资产**当"依赖文档"删了，office 技能激活失败，
          # 1.0.19 的正式包里办公能力直接是坏的 —— 而包装得上、启动得了、
          # 法律模式也在，从外面看一切正常。
          # 这条断言把"裁剪"约束成白名单行为：想删新的一类，就必须显式改这里。
          comm -23 /tmp/rt-before.txt /tmp/rt-after.txt > /tmp/rt-deleted.txt
          UNEXPECTED=$(grep -vcE '\.(map|d\.ts|d\.ts\.map)$|/(\.eslintrc[^/]*|\.prettierrc[^/]*|tsconfig\.json|\.editorconfig)$' /tmp/rt-deleted.txt || true)
          if [ "$UNEXPECTED" -ne 0 ]; then
            echo "::error::裁剪删掉了 ${UNEXPECTED} 个预期之外的文件 —— 运行时资产可能被误删，包会变成「能启动但功能坏」"
            grep -vE '\.(map|d\.ts|d\.ts\.map)$|/(\.eslintrc[^/]*|\.prettierrc[^/]*|tsconfig\.json|\.editorconfig)$' /tmp/rt-deleted.txt | head -20
            exit 1
          fi
          echo "裁剪删除 $(wc -l < /tmp/rt-deleted.txt | tr -d ' ') 个文件，全部属于预期类别"

          # 再点名兜一道：这几个是已知的运行时资产，缺一个插件就激活失败。
          for f in \
            dsh-runtime/node_modules/@deepseek-ai/dsh-skill-office/assets/office-docx/SKILL.md \
            dsh-runtime/node_modules/@deepseek-ai/dsh-skill-office/assets/office-xlsx/SKILL.md \
            dsh-runtime/node_modules/@deepseek-ai/dsh-skill-office/assets/office-pptx/SKILL.md ; do
            test -f "$f" || { echo "::error::运行时资产缺失：$f"; exit 1; }
          done
          after_files=$(find dsh-runtime -type f | wc -l | tr -d ' ')
          after=$(du -sm dsh-runtime | awk '{print $1}')
          echo "裁剪随包运行时：${before} MB / ${before_files} 个 → ${after} MB / ${after_files} 个（省 $((before-after)) MB）"

          # 断言真的裁掉了：依赖结构变化导致裁剪静默失效时，这里必须失败，
          # 而不是悄悄发一个大了 110MB 的包出去。
          saved=$((before-after))
          if [ "$saved" -lt 70 ]; then
            echo "::error::裁剪只省了 ${saved} MB，低于预期（约 110MB）—— 依赖结构可能变了，请检查"
            exit 1
          fi

          # 裁完必须还能跑
          node dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js --version
          node -e "console.log('bundled DSH runtime ready:', require('./dsh-runtime/node_modules/@deepseek-ai/dsh/package.json').version)"

      # office 载荷：精简 CPython 3.12 + 文档库（Word / Excel / PPT 生成）。
      # PDF 渲染由随包 DSH 运行时自带的 LibreOffice Kit 提供（0.2.0-rc.2 里仍在），不含在这里。
      # 按 job 的目标架构构建：CPython 二进制与 lxml / Pillow 的 wheel 都是架构绑定的；
      # 宿主架构与目标不一致时，脚本用 pip --platform 交叉安装（无需 Intel runner）。
      - name: Prepare office runtime
        shell: bash
        run: node scripts/build-office-runtime.js "${{ matrix.office-target }}"

      # 随包插件：从 npm 拉取已发布的正式包（中文合规 + 公文排版），让用户装完即用。
      # ⚠️ 2026-10-17（P0-0 续）：LibreOffice 引擎包是**架构绑定**的，而 npm 在 runner 上
      #   只会装「宿主架构」那一份 —— macos-latest 是 arm64，于是 matrix 里的 macos-x64
      #   job 打出的 x64 包里塞进的是 arm64 引擎 → 用户侧「Office 预览不可用」，
      #   而所有守卫都是绿的（正是 release-selfcheck 里写的「装得上、用不了」）。
      #   Linux 没有发布原生引擎，kit 会回退 wasm，但要先清掉 npm 为不存在的
      #   optionalDependency 建出来的空目录，否则 kit 抛 incomplete 而不是回退。
      - name: 按目标架构准备 LibreOffice 引擎
        shell: bash
        run: node scripts/prepare-office-engine.js "${{ matrix.office-target }}"

      - name: Prepare bundled plugins
        shell: bash
        run: node scripts/build-bundled-plugins.js

      # 出门前把关：electron-builder 对 extraResources 里**不存在**的目录是
      # 静默跳过的（干净检出上不带这三个目录也能打包「成功」）。也就是说上面
      # 任何一步将来失效，都会安安静静地打出一个「装完不能用」的安装包 ——
      # 而用户要的恰恰是装完即用。所以在这里显式断言三个载荷都在且非空。
      - name: 校验随包载荷齐备（缺一个都不许出门）
        shell: bash
        run: |
          set -e
          check() { # $1=目录  $2=说明  $3=最低字节数
            test -d "$1" || { echo "❌ 缺少随包载荷 ${1}（${2}）"; exit 1; }
            N=$(find "$1" -type f | wc -l | tr -d ' ')
            S=$(du -sk "$1" | cut -f1)
            echo "  $1: $N 个文件, ${S} KB — $2"
            test "$N" -ge 1 || { echo "❌ $1 是空目录"; exit 1; }
            test "$S" -ge "$3" || { echo "❌ $1 只有 ${S} KB，低于下限 $3 KB"; exit 1; }
          }
          echo "---- 随包载荷检查 ----"
          check dsh-runtime    "随包 DSH 运行时" 50000
          check legal-mode     "法律模式载荷" 1
          # office 载荷各平台体积不同（Windows 无 LibreOffice Kit），下限给保守值
          check office-runtime "office 载荷（CPython + 文档库）" 10000
          check bundled-plugins "随包插件（合规 + 公文排版）" 10
          echo "✅ 四个载荷齐备"

      - name: 离线守卫（注入竞态 / 菜单中文 / 法律模式花名册）
        run: |
          node scripts/test-inject-race.js
          node scripts/check-menu-i18n.js
          # Office 转换链路：不许再依赖 office-runtime/bin/node（Windows 上是 node.cmd，1.0.61「转换器未就绪」根因）
          node scripts/check-office-node-wrapper.js
          # 模型改名补丁的清理回归（老用户升级后要恢复官方 1017 徽章）
          node scripts/test-model-label.js
          # 兜底命令里的 DSH 版本迁移（老用户 settings.command 可能钉着远古版本）
          node scripts/test-settings-migrate.js
          # 法律模式必须真的进 Agent 预设花名册 —— 只验客户端插件在不在是不够的：
          # 曾经客户端插件好好的，而预设写进了运行时已不读的目录，
          # 三平台的选择器里都没有「法律模式」，所有检查却都是绿的。
          node scripts/check-legal-preset-roster.js
          # patch 文件损坏自愈（Windows 更新中途杀进程 → 空字节 → DSH 起不来）
          node scripts/test-patch-heal.js
          # office 行的路径自愈（asar 时代写下的 cli: → 升级用户 Office 三件套静默失效）
          node scripts/test-office-row-heal.js
          # 写好并验过的壳插件必须真的进包（视频预览插件曾"源码在、没人声明"= 等于没发）
          node scripts/check-shell-plugins-shipped.js
          # DSH 起没起来的判据：地址行是第二信号 / 提前退出与 spawn 失败要立刻报 / 重试不留孤儿
          node scripts/test-service-readiness.js
          # 旧 preset id 自愈（早期写的 legal → 现行 legal-mode，升级用户"新建会话建不了"）
          node scripts/test-preset-heal.js
          # 官方插件市场的索引播种（新装用户打开「插件市场」是满的还是空页；尊重用户删除）
          node scripts/test-plugin-market.js
          # 更新必须能被用户停下（点取消却继续下载的接线回归）
          node scripts/check-update-cancel.js
          # 右栏全屏不能透底/白屏，同时不能把主界面辉光做没（2026-10-14 用户截图）
          node scripts/check-skin-fullscreen.js
          # asar 化之后，从 asar 里复制包必须走得通（Office 物化靠它）
          node scripts/test-asar-copy.js
          # asar 这一对约束：引擎/kit 必须解包 + 物化必须用 asar 安全的 copyTree
          node scripts/check-asar-packaging.js
          # 故障日志要能当证据：凭据打码 + 每条带版本/平台/安装目录 + 导航中止不记账
          node scripts/test-fault-log.js
          # 这个版本要发出去，更新说明必须齐（whatsnew 条目 + CHANGELOG 段）
          node scripts/check-release-notes.js
          # 客户层插件 bundle 必须返回插件对象（2026-10-15：一个坏 bundle 让整页崩）
          node scripts/check-client-bundles.js shell-plugins bundled-plugins

      - name: Package (构建安装包，不发布)
        run: npm run dist -- --publish never ${{ matrix.args }}
        env:
          # 未配置签名证书时产出未签名安装包（功能可用，但系统会提示"无法验证开发者"）。
          # 配置好签名/公证 Secrets 后，删除下面这一行（mac 任务）即可自动签名+公证。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # —— 可选：macOS 签名（两种方式任选其一）——
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # CSC_NAME: ${{ secrets.CSC_NAME }}
          # —— 或 ——
          # MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # —— 可选：macOS 公证（三种方式任选其一）——
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # —— 或 ——
          # APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          # APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # —— 或 ——
          # APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
          # —— 可选：Windows 签名 ——
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # 离线守卫：不进 CI 的守卫等于没有守卫 —— 这些缺陷当年都是"打出了包才发现"，
      # 而打出包之后再发现，代价就是让用户下到一个装完不能用的版本。
      # 两个都是纯 Node、不开窗口、秒级完成：
      #   · test-inject-race.js  —— home/profile 两层注入、只读载荷、幂等、老用户升级
      #   · check-menu-i18n.js   —— 每个 role 都必须显式写中文 label
      #     （Electron 的 role 只给行为不给文案，漏写就会冒出英文默认项）
      # 打包完整性守卫（2026-10-05 事故）：Windows 1.0.52 启动即崩
      #   `Error: Cannot find module 'tree-kill'`（主进程顶层 import 失败 → 应用打不开）
      # 依赖没进包 = 装完就是一个打不开的软件，必须在出门前拦住。
      - name: 能力基线 · Office 预览必须在**打包产物**上真的能用（P0-0）
        shell: bash
        run: |
          # 2026-10-15 事故：asar 打包后 mac 的 Office 预览全坏，而当时所有守卫都是绿的 ——
          # 因为它们断言的是"机制"（文件解包了），不是"能力"（真能转出 PDF）。
          # 这条在真实产物上调 createConverter + 真转一个 docx，坏包上必红（已实测）。
          node scripts/check-office-preview-packaged.js

      - name: 能力基线 · 更新弹窗按钮排版（渲染后按坐标断言，只在 macOS 跑一次）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # 2026-10-15 用户指出「按钮排列一点都不严谨」：实测旧版 footer 拆成两行 →
          # 主按钮孤零零落在第二行右下、两行高度差 2px。这条断言**真渲染**五个阶段，
          # 按"实际画出来的按钮 + 坐标"判定（不看 DOM 属性 —— 按属性判会漏掉
          # display 覆盖 [hidden] 导致"五个按钮全画出来"这类问题）。
          node scripts/check-update-popup-layout.js

      - name: 能力一致性 · CDN 多段 range 与客户端差分开关必须匹配（P0-2）
        shell: bash
        run: |
          # 2026-10-15 事故：把 blockmap 传上 CDN 后，Windows 更新退化成"越下越慢"。
          # 这条断言真去请求一次多段 range，再读我们的代码，两者不一致就红。
          node scripts/check-updater-differential.js

      - name: 打包完整性守卫（生产依赖必须真的进包）
        shell: bash
        run: |
          # 2026-10-17：把三个守卫**分别跑**并各自标注。
          # 此前它们串在一个 run 块里，GitHub bash 默认 set -e —— 第一个失败就中止，
          # 后面的不跑，而且失败原因写在 stderr（GitHub 不解析），
          # 于是 Windows 上「到底是哪一个守卫红的」查了两轮都看不到。
          run_guard() {
            local name="$1"; shift
            echo "::group::守卫 · $name"
            if ! "$@"; then
              echo "::error::守卫失败：$name"
              exit 1
            fi
            echo "::endgroup::"
          }
          # ⚠️ 2026-10-14：判据从"只找真实目录"改成走脚本 —— 运行时改回 asar 打包后，
          # node_modules 在 app.asar **里面**，原来那句
          # `find release dist -type d -ipath "*resources/app/node_modules/$mod"`
          # 在四个平台同时报红（Release run 38567857212）。脚本同时认"真实目录"与"asar 条目"。
          # 「本版更新内容」在 Windows/Linux 必须有够得着的入口（不能只靠会被隐藏的菜单栏）
          run_guard "手机连接 webserver 配置（不能用通配地址）" node scripts/test-mobile-connect-host.js
          run_guard "本版更新内容入口" node scripts/check-whatsnew-entry.js
          # 安装器必须能自己关掉运行中的旧版（托盘应用 + 默认温和关闭 = 用户被要求手动关）
          run_guard "安装器能关掉旧版" node scripts/check-installer-close-app.js
          echo "---- 检查打包产物里的生产依赖（electron-builder 输出目录是 release/，见 electron-builder.yml）----"
          run_guard "生产依赖进包" node scripts/check-packaged-deps.js release dist

      - name: Upload artifacts (仅安装包，排除未打包 app 目录)
        uses: actions/upload-artifact@v4
        with:
          name: deepwhale-desktop-${{ matrix.key }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    needs: build
    # 只有推送 v* tag 才发布；手动触发的构建只留 Actions artifacts，供发版前验证
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 同步到 OBS 那一步要跑仓库里的 scripts/sync-to-obs.js，
      # 所以这里必须有 checkout —— 原来这个 job 只跑 gh 命令，不需要仓库。
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 手动触发的预览构建：把 Windows 安装包传到 CDN 的 preview/ 目录，方便国内直接下载验证。
      # 只传 exe，不传 latest*.yml（绝不影响 62 用户的更新检查）。
      - name: 预览包同步到 CDN（仅手动触发 / Windows）
        if: github.event_name == 'workflow_dispatch' && matrix.key == 'windows-x64'
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
        run: |
          set -e
          if [ -z "$OBS_AK" ]; then echo "::warning::未配置 OBS_AK，跳过预览同步"; exit 0; fi
          mkdir -p preview-out
          cp release/*.exe preview-out/ 2>/dev/null || true
          ls -lh preview-out
          node scripts/sync-to-obs.js --dir preview-out --key-prefix preview/1.0.63 --concurrency 4

      - name: 汇总三平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: 列出待上传产物（调试用）
        run: find dist-assets -type f | sort

      # 出门前把关：四个平台缺一不可。曾经因为两个 mac job 的 artifact 撞名，
      # download-artifact 合并时把 macOS arm64 整个覆盖掉，而所有 job 都是绿的、
      # 日志里毫无异常 —— 结果发布出去的版本 Mac 用户没得下载。
      - name: 校验四平台产物齐备（缺一个都不许发布）
        run: |
          set -e
          V="${{ github.ref_name }}"; V="${V#v}"
          missing=0
          for f in \
            "DeepWhale-Desktop-${V}-arm64.dmg" \
            "DeepWhale-Desktop-${V}-x64.dmg" \
            "DeepWhale-Desktop-${V}-x64-Setup.exe" \
            "DeepWhale-Desktop-${V}-x86_64.AppImage" \
            "DeepWhale-Desktop-${V}-amd64.deb" \
          ; do
            if [ -f "dist-assets/$f" ]; then
              echo "  ✅ $f ($(du -h "dist-assets/$f" | cut -f1))"
            else
              echo "  ❌ 缺少 $f"
              missing=$((missing+1))
            fi
          done
          test "$missing" -eq 0 || { echo "::error::有 $missing 个平台产物缺失，拒绝发布"; exit 1; }
          echo "✅ 四平台产物齐备"

      # ⚠️ 2026-10-03 新增：mac 的 arm64 / x64 是两个 job，各生成一份 latest-mac.yml，
      #    download-artifact 合并时后传的覆盖先传的 → 清单里只剩一个架构，
      #    Apple 芯片用户会被推 x64 包。这里用"目录里实际存在的 zip"把缺失架构补回来，
      #    并按真实产物重算 sha512/size（顺带兜住任何构建后改动产物的情形）。
      - name: 校正 mac 更新清单（补双臂 + 重算哈希）
        working-directory: .
        run: node scripts/rewrite-update-manifest.js --manifest dist-assets/latest-mac.yml --dir dist-assets --ensure-both-arch

      - name: 创建 Draft Release 并上传全部附件
        run: |
          # 用模板表达式取标签名（环境变量 GITHUB_REF_NAME 在某些场景为空，会导致建出 untagged 草稿）
          TAG="${{ github.ref_name }}"
          VER="$TAG" python3 - <<'PY'
          import os, textwrap
          v = os.environ['VER']
          notes = textwrap.dedent(f'''
          # DeepWhale Desktop {v}

          ## 下载
          - macOS（Apple Silicon / Intel）：`DeepWhale-Desktop-{v}-arm64.dmg` / `DeepWhale-Desktop-{v}-x64.dmg`
          - Windows x64：`DeepWhale-Desktop-{v}-x64-Setup.exe`
          - Linux：`DeepWhale-Desktop-{v}-x86_64.AppImage` / `DeepWhale-Desktop-{v}-x86_64.deb`

          ## 同一版本内的律师端（法律版，需激活）
          - Windows x64：`DeepWhale-Lawyer-*-x64-Setup.exe`
          - macOS（Apple Silicon / Intel）：`DeepWhale-Lawyer-*-arm64.zip` / `DeepWhale-Lawyer-*-x64.zip`
          - Linux：`DeepWhale-Lawyer-*-x86_64.AppImage` / `DeepWhale-Lawyer-*-x86_64.deb`
          - 三系统合体包（桌面端 + 律师端）：见 `suite-{v}` 发布页

          > 装完务必先打开一次律师端并完成激活：`deepwhale-law` 链接协议是律师端
          > 首次运行时才向系统登记的，只装不开则不会登记，深鲸桌面里选「法律模式」
          > 就不会弹出律师端（macOS 拖进「应用程序」时即自动登记，无需额外操作）。

          ## 更新内容
          - 把 DeepSeek Harness Web UI 装进原生窗口的跨平台桌面壳：背景皮肤、桌面宠物、用量/额度面板、API Key 安全存储
          - 免费开源（MIT）

          ## 特别感谢
          - [DeepSeek Harness](https://github.com/deepseek-ai/deepseek-harness) 与 DeepSeek AI 团队：DSH 本身

          > 本项目是基于 DeepSeek Harness 构建的社区桌面版本，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
          > 本项目完全开源免费。如果有人向您以任何形式出售此软件，请拒绝交易。
          ''')
          notes = notes.strip('\n') + '\n'
          open('/tmp/release-notes.md', 'w', encoding='utf-8').write(notes)
          PY
          # ⚠️ 2026-10-03 修：原来无条件 `gh release delete` 再重建草稿 ——
          #    一旦重跑这个 job，**已经公开发布的版本会被删掉重建成草稿**（用户链接瞬间失效）。
          #    改成：已存在就只覆盖资产与说明，绝不改它的 draft/latest 状态。
          if gh release view --repo "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 只覆盖资产，不删除、不降级为草稿"
            gh release edit --repo "$GITHUB_REPOSITORY" "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create --repo "$GITHUB_REPOSITORY" "$TAG" --draft \
              --title "DeepWhale Desktop $TAG" \
              --notes-file /tmp/release-notes.md
          fi
          # 上传全部产物（排除 electron-builder 的调试文件）
          gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" $(find dist-assets -type f ! -name 'builder-debug.yml') --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把桌面端安装包同步到 OBS，用户经 CDN（https://dl.deepwhale.org.cn）下载。
      #
      # 此前这一步是 scp 到 ECS：实测 GitHub 美国 runner → 国内 ECS 只有
      # 0.19–1.0 MB/s，仅桌面端就约 1.4 GB、要 90 分钟以上；传 OBS 多数文件
      # 8–12 MB/s，几分钟完成。下载侧也由 CDN 承担，不再占那台 ECS 的公网带宽。
      #
      # 前置 Secrets：OBS_AK / OBS_SK / OBS_BUCKET / OBS_ENDPOINT
      # （律师端与套装由 sync-downloads 工作流负责，那条会在 Release 发布时自动跑）
      - name: 同步桌面端安装包到 OBS
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
        run: |
          set -e
          if [ -z "$OBS_AK" ]; then
            echo "::warning::未配置 OBS_AK，跳过同步（请在 Settings → Secrets 添加）"
            exit 0
          fi
          # sync-to-obs.js 默认排除桌面端 .zip（官网不提供该格式，占同步量约 29%）与 blockmap。
          #
          # ⚠️ 2026-10-02 修：**latest*.yml 必须一起同步**。
          #    它们是 electron-updater 读取的更新清单 —— 不传，用户就永远收不到新版本。
          #    原来这里有两道筛子（脚本 DEFAULT_EXCLUDE 一条 + 下面的 case 一条），
          #    而且文件名是 latest.yml，**根本不匹配 DeepWhale-Desktop-* 这个 glob**，
          #    所以 1.0.38 / 1.0.39 两次发版 yml 都停在上一个版本，靠手工补传才修好。
          mkdir -p obs-desktop
          for f in dist-assets/DeepWhale-Desktop-*; do
            [ -f "$f" ] || continue
            case "$f" in
              # ⚠️ 2026-10-15 更正（同一天内反转，教训记在这）：**blockmap 不能传**。
              #    10-14 我为了"开启差分更新"把 blockmap 传了上去（P1-3），结果把一条坏路打开了：
              #    我们的 CDN 不支持多段 range（发多段 Range 返回 200 + 整包，却带着
              #    Accept-Ranges: bytes）→ electron-updater 以为支持、按 multipart 解析整包裸数据
              #    → **Windows 用户更新时"80% 之后越下越慢、卡在 95%"**（2026-10-15 实测上报）。
              #    以前没这毛病，正是因为 CDN 上没有 blockmap → 差分前缀失败 → 自动全量下载（快）。
              #    所以现在：① 客户端关掉差分（update-manager.ts 的 disableDifferentialDownload）；
              #    ② 发布不再上传 blockmap。等 CDN 真支持多段 range 时，
              #    `scripts/check-updater-differential.js` 的一致性断言会提醒我们放开这两处。
              *.blockmap) continue;;
              # ⚠️ 2026-10-03 修：**mac 的两个 zip 必须传**。
              #    原来这里把 .zip 一并跳过，理由是"官网不提供该格式" —— 但 electron-updater
              #    在 macOS 上读的正是 latest-mac.yml 里指的 zip：CDN 上没有它，
              #    用户能"检查到更新"、下载阶段却 403 失败（2026-10-03 实测藏了一周）。
              #    Windows/Linux 仍然跳过（它们走 exe/AppImage/deb，zip 纯占体积）。
              *.zip)
                case "$f" in *-arm64.zip|*-x64.zip) : ;; *) continue;; esac;;
            esac
            cp "$f" obs-desktop/
          done
          # 「本版更新内容」：旧版本的壳会来 CDN 拉它，好让用户升级前就知道改了什么
          if [ -f assets/whatsnew.json ]; then
            cp assets/whatsnew.json obs-desktop/whatsnew.json
          fi
          # 更新清单（体积只有几百字节，但决定"用户能不能收到更新"）
          for y in dist-assets/latest*.yml; do
            [ -f "$y" ] || continue
            cp "$y" obs-desktop/
          done
          echo "待同步 $(find obs-desktop -type f | wc -l) 个文件"
          START=$(date +%s)
          # ⚠️ --no-exclude 必须带：我们已经在上面显式挑好了要传的文件，
          #    而 sync-to-obs.js 的默认规则里还有一条「排除桌面 .zip」——
          #    不加这个参数，刚挑出来的 mac zip 会在脚本内部被二次过滤掉
          #    （1.0.47 / 1.0.48 两次发版都栽在这一条上）。
          node scripts/sync-to-obs.js --dir obs-desktop --no-exclude
          END=$(date +%s)
          D=$((END-START)); [ "$D" -eq 0 ] && D=1
          SZ=$(du -sm obs-desktop | cut -f1)
          echo "✅ 桌面端已同步到 OBS：${SZ} MB / ${D}s / $((SZ/D)) MB/s"

      # ⚠️ 2026-10-03 新增：同步完立刻核对 CDN —— 清单里引用的文件必须真的能下。
      #    只核对桌面端（--scope desktop）：律师端有它自己的发布流程，
      #    免得"律师端清单旧"这种无关问题连带把桌面发版判失败。
      - name: 核对 CDN 上的更新清单与产物（不通过即失败）
        working-directory: .
        run: |
          set -e
          for i in 1 2 3; do
            if node scripts/check-cdn-artifacts.js --scope desktop; then exit 0; fi
            echo "::warning::第 $i 次 CDN 核对未通过，20 秒后重试"
            sleep 20
          done
          echo "::error::CDN 产物核对连续 3 次失败"
          exit 1
