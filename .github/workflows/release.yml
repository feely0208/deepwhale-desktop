# 发布工作流：推送 v* 标签 → 三平台打包 → 上传到 GitHub Releases（Draft，人工确认后公开）
# 模式参考 anywhere-labs/deepseek-harness-desktop：GitHub Releases 承载安装包（DMG/EXE/AppImage/deb）。
# 详见 RELEASING.md
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 预创建 Draft Release：先清理该标签下的旧草稿，再创建带发布说明模板的新草稿。
  # 三个平台的 electron-builder 随后只往这一个草稿上传附件，
  # 避免并发发布时各自"创建草稿"产生分叉（多个草稿、附件散落）。
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: 清理旧草稿并创建新 Draft Release
        run: |
          VER="$GITHUB_REF_NAME" python3 - <<'PY'
          import os, textwrap
          v = os.environ['VER']
          notes = textwrap.dedent(f'''
          # DeepWhale Desktop {v}

          ## 下载
          - macOS（Apple Silicon / Intel）：`DeepWhale-Desktop-{v}-arm64.dmg` / `DeepWhale-Desktop-{v}-x64.dmg`
          - Windows x64：`DeepWhale-Desktop-{v}-x64-Setup.exe`
          - Linux：`DeepWhale-Desktop-{v}-x86_64.AppImage` / `DeepWhale-Desktop-{v}-x86_64.deb`

          ## 更新内容
          - 把 DeepSeek Harness Web UI 装进原生窗口的跨平台桌面壳：背景皮肤、桌面宠物、用量/额度面板、API Key 安全存储
          - 永久免费 · 开源（MIT）

          > 本项目是基于 DeepSeek Harness 构建的社区桌面版本，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
          > 本项目完全开源免费。如果有人向您以任何形式出售此软件，请拒绝交易。
          ''')
          notes = notes.strip('\n') + '\n'
          open('/tmp/release-notes.md', 'w', encoding='utf-8').write(notes)
          PY
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "DeepWhale Desktop $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + assets)
        run: npm run build

      - name: Package & publish to GitHub Release (draft)
        run: npm run dist -- --publish always ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置签名证书时产出未签名安装包（功能可用，但系统会提示"无法验证开发者"）。
          # 配置好签名/公证 Secrets 后，删除下面这一行（mac 任务）即可自动签名+公证。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # —— 可选：macOS 签名（两种方式任选其一）——
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # CSC_NAME: ${{ secrets.CSC_NAME }}
          # —— 或 ——
          # MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # —— 可选：macOS 公证（三种方式任选其一）——
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # —— 或 ——
          # APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          # APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # —— 或 ——
          # APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
          # —— 可选：Windows 签名 ——
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: deepwhale-desktop-${{ matrix.os }}
          path: release/**
          if-no-files-found: warn
