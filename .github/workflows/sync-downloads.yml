# 同步安装包到官网服务器（deepwhale.org.cn）
#
# 用途：把某个 Release 的桌面端安装包从 GitHub 同步到官网服务器，
#       让国内用户从官网直接下载（GitHub 在国内很慢）。
#
# 触发方式：
#   1. 手动：Actions → Sync downloads → Run workflow，填 tag（如 v1.0.5）
#   2. 自动：每次发布 Release 时自动执行
#
# 前置：仓库 Settings → Secrets → Actions 配置 DW_DEPLOY_KEY（部署 SSH 私钥）
#       可选 DW_DEPLOY_HOST（默认 root@115.120.202.30）
name: Sync downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v1.0.5)'
        required: true
        default: 'v1.0.5'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Release 安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "同步 tag: $TAG"
          mkdir -p assets
          # 三类产物都要同步。此前只同步 DeepWhale-Desktop-*，律师端与套装
          # 一直是手工上传的 —— 这就是「官网与 GitHub 长期不一致」的根因
          # （壳发到 v1.0.16 时，官网的套装还停在 1.0.15）。
          # 逐个 pattern 拉取：某个 tag 下没有该类资产时只提示、不失败
          # （例如套装 release 里不会有桌面端安装包）。
          for PAT in 'DeepWhale-Desktop-*' 'DeepWhale-Lawyer-*' 'DeepWhale-Suite-*'; do
            echo "→ 拉取 ${PAT}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
              --pattern "$PAT" --clobber || echo "  （该 tag 下没有匹配 $PAT 的资产，跳过）"
          done
          # 去掉 electron-builder 的调试/元数据文件
          rm -f assets/*.blockmap assets/*.yml
          COUNT=$(find assets -type f | wc -l | tr -d ' ')
          echo "共取到 $COUNT 个资产"
          # 一个都没取到说明 tag 填错了 —— 这时静默「成功」最危险，
          # 会让官网停留在旧版本却以为已经同步过了。
          [ "$COUNT" -gt 0 ] || { echo "::error::tag $TAG 下没有可同步的安装包，请检查 tag"; exit 1; }
          ls -lh assets

      - name: 上传到官网服务器
        env:
          DW_DEPLOY_KEY: ${{ secrets.DW_DEPLOY_KEY }}
          DW_DEPLOY_HOST: ${{ secrets.DW_DEPLOY_HOST }}
        run: |
          set -e
          if [ -z "$DW_DEPLOY_KEY" ]; then
            echo "::warning::未配置 DW_DEPLOY_KEY，跳过上传（请在 Settings → Secrets 添加）"
            exit 0
          fi
          HOST="${DW_DEPLOY_HOST:-root@115.120.202.30}"
          DEST="/var/www/deepwhale.org.cn/downloads"
          mkdir -p ~/.ssh && printf '%s\n' "$DW_DEPLOY_KEY" > ~/.ssh/dw && chmod 600 ~/.ssh/dw
          ssh-keyscan -H "${HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/dw -o StrictHostKeyChecking=no "$HOST" "mkdir -p $DEST"
          n=0
          # 桌面端的 .zip 不上官网：官网只提供 dmg / exe / AppImage / deb，
          # .zip 是 electron-updater 在 macOS 上自动更新用的（走 GitHub）。
          # 套装（DeepWhale-Suite-*.zip）官网是要的，所以只排除桌面的。
          rm -f assets/DeepWhale-Desktop-*.zip
          for f in assets/DeepWhale-*; do
            [ -f "$f" ] || continue
            echo "→ $(basename "$f")"
            scp -i ~/.ssh/dw -o StrictHostKeyChecking=no "$f" "$HOST:$DEST/"
            n=$((n+1))
          done
          ssh -i ~/.ssh/dw -o StrictHostKeyChecking=no "$HOST" "chmod 644 $DEST/*"
          echo "✅ 已同步 $n 个安装包到官网（并设好读权限）"
          ssh -i ~/.ssh/dw -o StrictHostKeyChecking=no "$HOST" "ls -lh $DEST | tail -n +2"
