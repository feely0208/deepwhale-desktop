# 跟版验证：手动指定一个 DSH 运行时版本，验证「我们能不能跟到它」。
#
# 为什么要有这个工作流（2026-10-10）：
#   上游 @deepseek-ai/dsh 经常发新版本（含 alpha / rc）。我们随包一个固定运行时，
#   每次上游动到我们依赖的机制（0.1.7 废弃 .agent-presets → 法律模式预设从没进过花名册）
#   都会直接砸到用户。过去只能"在开发者本机折腾"来验证 —— 而本机跑打包冒烟会踩
#   沙箱 / 符号链接 / 复用用户实例等一堆环境坑（2026-10-10 亲历：应用放 /tmp 被沙箱拒、
#   符号链接替换 dsh-runtime/node_modules 导致没打进包），结论不可信。
#   → 把这件事放到 CI：环境干净、可重复、不占用任何人电脑。
#
# 触发：手动（Actions → Verify DSH version → Run workflow），填版本号即可。
# 产出：结论写进 Step Summary；完整日志作为 artifact。
name: Verify DSH version

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要验证的 @deepseek-ai/dsh 版本（留空则自动取 npm 的 alpha 标签）'
        required: false
        default: ''
      registry:
        description: 'npm 镜像源'
        required: false
        default: 'https://registry.npmmirror.com'
      run_packaged_smoke:
        description: '打包后是否跑打包态冒烟（更慢但更接近真实）'
        required: false
        default: 'true'
  # 每天 07:00 / 19:00（北京）自动验证 alpha 通道的最新版：上游一发我们就能知道能不能跟
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'

jobs:
  verify:
    runs-on: macos-14
    env:
      DSH_NPM_REGISTRY: ${{ inputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: 解析要验证的版本（留空则取 npm alpha 标签）
        id: ver
        run: |
          set -e
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(node -e "fetch('https://registry.npmmirror.com/@deepseek-ai/dsh').then(r=>r.json()).then(d=>console.log(d['dist-tags'].alpha||d['dist-tags'].latest))")
            echo "未指定版本 → 自动取 alpha 标签：$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "已解析版本：$V"

      - name: 钉住要验证的运行时版本
        run: |
          set -e
          echo "${{ steps.ver.outputs.version }}" > dsh-runtime.version
          node scripts/dsh-runtime-version.js --generate
          echo "将验证 DSH 运行时：$(node scripts/dsh-runtime-version.js)"

      - name: Build (tsc + assets)
        run: npm run build

      - name: Prepare bundled DSH runtime（照 release.yml，用镜像装指定版本）
        run: |
          set -e
          DSH_VERSION=$(node scripts/dsh-runtime-version.js)
          REGISTRY_ARGS=""
          if [ -n "${DSH_NPM_REGISTRY:-}" ]; then REGISTRY_ARGS="--registry=$DSH_NPM_REGISTRY"; fi
          npm install "@deepseek-ai/dsh@$DSH_VERSION" --prefix dsh-runtime --no-audit --no-fund --loglevel=error $REGISTRY_ARGS
          test -f dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
          node scripts/dsh-runtime-version.js --check

      # ⚠️ 必须照 release.yml 的顺序：office 载荷也要先生成，
      #    否则 test-inject-race.js 会判定"载荷不齐"并主动报错（它拒绝跑成假通过）。
      - name: Prepare office runtime
        run: node scripts/build-office-runtime.js darwin-arm64

      - name: Prepare bundled plugins
        run: node scripts/build-bundled-plugins.js

      - name: 环境诊断（定位花名册红）
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "runtime version: $(node scripts/dsh-runtime-version.js)"
          echo "---- dsh --version ----"; node dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js --version 2>&1 | head -5
          echo "---- dsh --profile deepwhale --dump-config（前 5 行）----"
          node dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js --profile deepwhale --dump-config 2>&1 | head -5

      - name: 离线守卫（跟版最关键的四项）
        run: |
          set -e
          echo "---- ① 注入竞态 ----"; node scripts/test-inject-race.js
          echo "---- ② 菜单中文 ----"; node scripts/check-menu-i18n.js
          echo "---- ③ 法律模式花名册（上游最容易砸到我们的一处）----"; node scripts/check-legal-preset-roster.js
          echo "---- ④ patch 自愈 ----"; node scripts/test-patch-heal.js

      # 🔎 条件是 `!= 'false'` 而不是 `== 'true'`：
      #    定时触发（schedule）时 inputs 是空的，`== 'true'` 会**静默跳过**这两步 ——
      #    于是每天两次的自动跟版其实从来没测过打包产物。默认就该跑，只有手动显式
      #    填 false 才跳过。
      - name: Package (不发布)
        if: ${{ inputs.run_packaged_smoke != 'false' }}
        run: |
          set -e
          echo "---- 打包前诊断 ----"
          node -v; echo "cwd=$(pwd)"
          ls -la dist/main/index.js
          echo "---- 打包（用项目自己的 dist-local.sh：团队惯用入口，已处理输出目录等细节）----"
          bash scripts/dist-local.sh --mac --arm64 --config.directories.output=release-verify --publish never
          echo "---- 产物 ----"
          # ⚠️ find 的 -o 要加括号，否则 -maxdepth 只作用于前半段
          find release-verify -maxdepth 4 \( -name '*.app' -o -name '*.dmg' -o -name '*.zip' \) 2>/dev/null | head -10 || true

      - name: 打包态冒烟（直接跑 release-verify 里刚打出来的 .app）
        if: ${{ inputs.run_packaged_smoke != 'false' }}
        timeout-minutes: 15
        run: |
          # ⚠️ 这一步必须跑**刚打出来的包**。
          #    2026-10-10 的首版只调了 smoke-local.sh 的默认（开发态）分支 —— 它会重新
          #    build 并跑 dist/main/index.js，根本没碰 release-verify 的产物，断言
          #    ui-legal-mode 因此对不上（一次"测错对象"的假红）。
          #    现在显式传 --app，走脚本的打包态分支：跳过 build、直接跑打包产物，并由
          #    脚本负责 userData / DSH_HOME / 端口 的隔离与回收（含"复用用户实例"这个坑）。
          set -uo pipefail
          APP=$(find release-verify -maxdepth 4 -type d -name 'DeepWhale Desktop.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            # 兜底：productName 若被改过，仍按任意 .app 找（总比"找不到就跳过"强）
            APP=$(find release-verify -maxdepth 4 -type d -name '*.app' 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "::error::release-verify 里没有找到 DeepWhale Desktop.app —— 打包步骤没有产出"
            ls -la release-verify 2>/dev/null || true
            exit 1
          fi
          echo "待冒烟的应用：$APP"
          ls -la "$APP/Contents/MacOS/" 2>/dev/null || true

          set +e
          SMOKE_LOG=/tmp/verify-app.log bash scripts/smoke-local.sh --app "$APP" 2>&1 | tee /tmp/verify-smoke.log
          SMOKE_RC=${PIPESTATUS[0]}
          set -e
          echo "smoke-local.sh exit=$SMOKE_RC"

          # 关键断言（历史上出过假绿的两处）—— 与脚本内部的断言互为交叉验证
          fail=0
          grep -q "@deepseek-ai/dsh-client-ui-legal-mode" /tmp/verify-smoke.log \
            || { echo "::error::客户端插件 ui-legal-mode 未出现 —— 注入链路可疑"; fail=1; }
          # ⚠️ `[smoke] ok` 要在**完整应用日志**里查：smoke-local.sh 的结果区是
          #    `head -20` 裁过的摘要，轮不到最后才打印的 [smoke] ok（0.1 版就踩了）。
          grep -q "\[smoke\] ok" /tmp/verify-app.log \
            || { echo "::error::没有看到 [smoke] ok —— 检查链没跑完，结果不可信"; fail=1; }
          ! grep -qE "DSH 启动失败|service failed" /tmp/verify-app.log /tmp/verify-smoke.log \
            || { echo "::error::DSH 服务启动失败"; fail=1; }
          [ "$SMOKE_RC" = "0" ] || { echo "::error::smoke-local.sh 以 exit=$SMOKE_RC 结束（看上面的输出与日志）"; fail=1; }
          exit $fail

      - name: 抓上游 release notes（CI 能访问 GitHub，本机被墙）
        if: always()
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT=/tmp/release-notes.md
          gh api "repos/deepseek-ai/deepseek-harness/releases/tags/dsh-v$V" --jq '.body' > "$OUT" 2>/dev/null ||           curl -sL --max-time 30 "https://api.github.com/repos/deepseek-ai/deepseek-harness/releases/tags/dsh-v$V" \
            -H "Accept: application/vnd.github+json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('body') or '(无 body)')" > "$OUT" 2>/dev/null || echo "(抓取失败)" > "$OUT"
          echo "---- release notes（dsh-v$V）----"; head -40 "$OUT"

      - name: 结论写入 Summary
        if: always()
        run: |
          {
            echo "## 跟版验证结果"
            echo ""
            echo "- 目标版本：\`${{ steps.ver.outputs.version }}\`"
            echo "- 是否跑打包冒烟：\`${{ inputs.run_packaged_smoke }}\`"
            echo ""
            echo "### 关键结论（看上面各步是否全绿）"
            echo "1. 运行时能否安装并起服务（离线守卫 ①-④ + 冒烟）"
            echo "2. 客户端插件注入：冒烟日志需含 \`ui-legal-mode\`"
            echo "3. **法律模式是否进花名册**：第 3 项守卫（历史上被上游砸过）"
            echo ""
            echo "> 全绿即可评估把 \`dsh-runtime.version\` 跟到该版本；"
            echo "> 若有红：把失败步骤的原样行贴给负责人，不要只报\"失败\"。"
            echo ""
            echo "### 上游 release notes"
            echo '```'
            head -30 /tmp/release-notes.md 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-dsh-${{ inputs.version }}-logs
          path: |
            /tmp/verify-smoke.log
            /tmp/verify-app.log
          if-no-files-found: ignore
