# 上游 DSH 版本监测 —— 官方一发布就提醒。
#
# 为什么需要（2026-09-29 用户原话）：
#   「为什么每次官方升级都是我告诉你的呢，你为什么没有第一时间抓到这个信息来告诉我呢？」
#   「因为我们宣传的就是让 deepseek 触手可及，如果节奏都跟不上还玩个鸡毛啊」
#
#   实情是当时根本没做监测：官方 0.2.0-rc.2 发布当天（09-29 17:56），
#   是用户从公众号看到告诉我，我才去查 npm —— 而我们随包还停在 0.1.7-rc.2。
#   更该被批评的是：本轮已经被上游版本变更坑过一次（0.1.7 废弃 .agent-presets，
#   法律模式预设因此从来没进过花名册），那次之后就该把"上游版本"当成一级风险来盯。
#
# 数据源：公共 npm registry，不需要任何凭据。
#
# ── 2026-10-20 两次收紧（用户要求：内部的东西不要给别人看到）──────────
# 第一次：不再开 Issue / 写评论（原来每检测到新版本就给 owner 发通知邮件，
#         Cc 里带 noreply/Subscribed 伪地址；而且 Issue 页面在公开仓库里人人可读）。
# 第二次（本版）：
#   ① **去掉 schedule** —— GitHub 上不再有自动运行，也就没有公开的定时运行记录；
#      只在需要时手动 Run workflow（或直接在本机跑，见下）。
#   ② 摘要只写 4 行版本数字，不再渲染 `upstream-issue-template.md` 里那段
#      「为什么要紧 / 建议动作 / 涉及哪些源文件」—— 那些属于内部流程，不往 Actions 界面放。
#
# 日常检测已改到本机（零公开）：
#     cd ~/dsh-desktop && python3 scripts/check-upstream-dsh.py
#   建议挂成每天的本地定时任务。
name: Watch upstream DSH

on:
  # 故意只留手动触发：公开仓库的 Actions 运行记录与摘要是匿名可读的，
  # 定时跑等于每天公开一次"我们落后上游多少"。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 比对上游最新版与我们随包的版本
        id: cmp
        run: python3 scripts/check-upstream-dsh.py --github-output

      - name: 有新版本 → 摘要只写版本数字
        if: steps.cmp.outputs.changed == 'true'
        env:
          PINNED: ${{ steps.cmp.outputs.pinned }}
          LATEST: ${{ steps.cmp.outputs.latest }}
          PUBLISHED: ${{ steps.cmp.outputs.published }}
        run: |
          set -e
          {
            echo '### 上游 DSH 有新版本'
            echo ''
            echo '| 项 | 版本 |'
            echo '|---|---|'
            echo "| 上游 latest | \`$LATEST\` |"
            echo "| 我们随包 | \`$PINNED\` |"
            echo "| 发布时间 | $PUBLISHED |"
            echo ''
            echo '> 影响面评估在本机跑：`python3 scripts/check-upstream-dsh.py`'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=上游 DSH 有新版本::${LATEST}（我们随包 ${PINNED}）"

      - name: 无新版本 → 摘要留一行结论
        if: steps.cmp.outputs.changed != 'true'
        env:
          PINNED: ${{ steps.cmp.outputs.pinned }}
          LATEST: ${{ steps.cmp.outputs.latest }}
        run: |
          echo "✅ 上游无新版本：latest=${LATEST} == pinned=${PINNED}" >> "$GITHUB_STEP_SUMMARY"
