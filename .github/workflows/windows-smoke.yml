# Windows 冒烟（2026-10-27 加）
#
# 为什么需要：62 发出去之后，Windows 实机上才暴露「打印报 kit incomplete」「更新后白屏」——
# 本地开发机是 mac，这两类问题在 mac 上永远看不出来。这个 workflow 在**真实的 Windows
# runner** 上把打好的程序跑一遍（DSH_DESKTOP_SMOKE=1），并把日志/截图带回来。
#
# 触发：手动（Actions → Windows smoke → Run workflow）。
#   刻意**不挂 push** —— 每次提交都烧 Windows runner 不值当；发版前手动跑一次即可。
#   仓库是公开的，标准 runner 免费。
#
# 判定：exit code 非 0 = 红；另外再断言几条关键行（Office 真实转换、插件全激活）。
name: Windows smoke

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # 不签名（runner 上没有证书；只要产物能跑就行）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DSH_DESKTOP_SMOKE: '1'
      DSH_DESKTOP_SMOKE_HIDDEN: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 随包载荷（与 release.yml 同序）──────────────────────────────
      - name: Prepare office runtime (CPython + docx/xlsx/pptx)
        run: node scripts/build-office-runtime.js win32-x64

      - name: Prepare LibreOffice engine (win32-x64)
        run: node scripts/prepare-office-engine.js win32-x64

      - name: Prepare bundled plugins
        run: node scripts/build-bundled-plugins.js

      - name: Build (tsc + assets)
        run: npm run build

      # 冒烟里的「真实转换」用 python-docx 造一个 docx
      - name: Install python-docx (for the real docx→pdf check)
        run: |
          python -m pip install --disable-pip-version-check python-docx

      # ── 打包（--dir：只要可运行的目录，不生成安装包，省时间）────────
      - name: Package (win --dir)
        run: npx electron-builder --win --dir

      # ── 跑冒烟 ──────────────────────────────────────────────────────
      - name: Run smoke
        shell: pwsh
        run: |
          $exe = "dist\win-unpacked\DeepWhale Desktop.exe"
          if (-not (Test-Path $exe)) { throw "找不到打包产物：$exe" }
          Write-Host "启动冒烟：$exe"
          $p = Start-Process -FilePath $exe `
            -ArgumentList '--no-sandbox','--disable-gpu' `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput smoke.out.log `
            -RedirectStandardError  smoke.err.log
          if (-not $p.WaitForExit(45 * 60 * 1000)) {
            Write-Host "⏱ 冒烟超时，强杀进程"
            try { $p.Kill($true) } catch {}
            throw "冒烟超时（45 分钟）"
          }
          Write-Host "冒烟退出码：$($p.ExitCode)"
          Write-Host "---- smoke.out.log（末尾 200 行）----"
          if (Test-Path smoke.out.log) { Get-Content smoke.out.log -Tail 200 | ForEach-Object { Write-Host $_ } }
          Write-Host "---- smoke.err.log（末尾 100 行）----"
          if (Test-Path smoke.err.log) { Get-Content smoke.err.log -Tail 100 | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0) { throw "冒烟失败：exit=$($p.ExitCode)" }

      - name: Assert key lines
        shell: pwsh
        run: |
          $log = ""
          foreach ($f in @('smoke.out.log','smoke.err.log')) {
            if (Test-Path $f) { $log += (Get-Content $f -Raw) }
          }
          $checks = @(
            @{ name = 'Office 真实转换（docx→pdf）'; pattern = 'Office 真实转换通过' },
            @{ name = '客户端插件 bundle 自检/激活';   pattern = 'plugin' }
          )
          foreach ($c in $checks) {
            if ($log -match [regex]::Escape($c.pattern)) {
              Write-Host "✅ $($c.name)"
            } else {
              Write-Host "❌ 缺少关键行：$($c.name)（pattern: $($c.pattern)）"
              $failed = $true
            }
          }
          # 白屏守卫触发过 = 红（真机渲染不出来，不该发版）
          if ($log -match 'renderer-blank|白屏守卫') {
            Write-Host "❌ 白屏守卫被触发（见日志）"
            $failed = $true
          }
          if ($failed) { throw "关键断言未通过" }

      - name: Upload logs & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            smoke.out.log
            smoke.err.log
            ${{ env.APPDATA }}\DeepWhale Desktop\logs\**
            ${{ env.APPDATA }}\DeepWhale Desktop\**\*.png
