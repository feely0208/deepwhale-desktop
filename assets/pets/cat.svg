<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes catIdle {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-6px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-2px); }
    }
    @keyframes catBlink {
      0%, 88%, 100% { transform: scaleY(1); }
      92%, 95% { transform: scaleY(0.1); }
    }
    .cat { animation: catIdle 2.6s ease-in-out infinite; transform-box: fill-box; }
    .eye { animation: catBlink 4s infinite; transform-box: fill-box; transform-origin: center; }
  </style>
  <g class="cat">
    <!-- 尾巴 -->
    <path d="M82 62 Q96 58 90 42 Q86 34 78 36" stroke="#9aa8b5" stroke-width="7" fill="none" stroke-linecap="round" />
    <!-- 身体 -->
    <ellipse cx="50" cy="70" rx="26" ry="22" fill="#c7d1db" />
    <!-- 头 -->
    <circle cx="50" cy="42" r="24" fill="#c7d1db" />
    <!-- 耳朵 -->
    <path d="M30 26 L24 6 L42 18 Z" fill="#c7d1db" />
    <path d="M70 26 L76 6 L58 18 Z" fill="#c7d1db" />
    <path d="M32 22 L28 12 L38 18 Z" fill="#f6b7c4" />
    <path d="M68 22 L72 12 L62 18 Z" fill="#f6b7c4" />
    <!-- 眼睛 + 高光 -->
    <ellipse class="eye" cx="41" cy="42" rx="3.4" ry="4.6" fill="#3b2b22" />
    <ellipse class="eye" cx="59" cy="42" rx="3.4" ry="4.6" fill="#3b2b22" />
    <circle cx="42.2" cy="40.2" r="1.2" fill="#fff" />
    <circle cx="60.2" cy="40.2" r="1.2" fill="#fff" />
    <!-- 鼻子与嘴 -->
    <path d="M48 50 L52 50 L50 53 Z" fill="#f6a4b8" />
    <path d="M50 53 Q46 57 43 55 M50 53 Q54 57 57 55" stroke="#3b2b22" stroke-width="1.6" fill="none" stroke-linecap="round" />
    <!-- 胡须 -->
    <path d="M28 48 L14 44 M28 52 L14 52 M28 56 L14 60" stroke="#9aa8b5" stroke-width="1.4" stroke-linecap="round" />
    <path d="M72 48 L86 44 M72 52 L86 52 M72 56 L86 60" stroke="#9aa8b5" stroke-width="1.4" stroke-linecap="round" />
    <!-- 腮红 -->
    <ellipse cx="30" cy="48" rx="4" ry="2.4" fill="#f6b7c4" opacity="0.7" />
    <ellipse cx="70" cy="48" rx="4" ry="2.4" fill="#f6b7c4" opacity="0.7" />
    <!-- 小爪 -->
    <ellipse cx="38" cy="92" rx="8" ry="5" fill="#c7d1db" />
    <ellipse cx="62" cy="92" rx="8" ry="5" fill="#c7d1db" />
  </g>
</svg>
