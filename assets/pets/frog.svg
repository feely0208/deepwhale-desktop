<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes frogIdle {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
      60% { transform: translateY(0); }
      80% { transform: translateY(-2px); }
    }
    @keyframes frogBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%, 97% { transform: scaleY(0.1); }
    }
    .frog { animation: frogIdle 2.8s ease-in-out infinite; transform-box: fill-box; }
    .eye { animation: frogBlink 4.4s infinite; transform-box: fill-box; transform-origin: center; }
  </style>
  <g class="frog">
    <!-- 身体 -->
    <ellipse cx="50" cy="62" rx="30" ry="24" fill="#7bc96f" />
    <ellipse cx="50" cy="66" rx="22" ry="14" fill="#a5dd9b" opacity="0.55" />
    <!-- 眼柄 + 眼睛 -->
    <rect x="32" y="34" width="9" height="10" rx="3" fill="#7bc96f" />
    <rect x="59" y="34" width="9" height="10" rx="3" fill="#7bc96f" />
    <circle class="eye" cx="36.5" cy="34" r="5.5" fill="#fff" />
    <circle class="eye" cx="63.5" cy="34" r="5.5" fill="#fff" />
    <circle class="eye" cx="37.5" cy="33.5" r="2.6" fill="#2f4a2a" />
    <circle class="eye" cx="64.5" cy="33.5" r="2.6" fill="#2f4a2a" />
    <!-- 微笑 -->
    <path d="M40 62 Q50 72 60 62" stroke="#2f4a2a" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- 腮红 -->
    <ellipse cx="28" cy="60" rx="5" ry="3" fill="#e88f8f" opacity="0.55" />
    <ellipse cx="72" cy="60" rx="5" ry="3" fill="#e88f8f" opacity="0.55" />
    <!-- 肚皮 -->
    <ellipse cx="50" cy="72" rx="16" ry="10" fill="#dff5da" />
    <!-- 脚 -->
    <ellipse cx="34" cy="86" rx="9" ry="4.4" fill="#5aa852" />
    <ellipse cx="66" cy="86" rx="9" ry="4.4" fill="#5aa852" />
  </g>
</svg>
