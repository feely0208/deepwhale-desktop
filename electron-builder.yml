# ⚠️⚠️ 安装器配置为「冻结项」，改动前必读 ⚠️⚠️
#   2026-10-04 事故：Windows 用户自动更新后应用整个消失（旧版被搬进 %TEMP% 又被清理）。
#   根因：appId 改名 + oneClick:false + allowToChangeInstallationDirectory:true。
#   以下四项被 scripts/check-installer-config.js 写死，改动会让 CI 直接失败：
#     · appId = com.deepwhale.desktop（不许再改：NSIS 用它拼注册表键记安装目录）
#     · nsis.oneClick = true（静默自动更新只支持一键安装器）
#     · nsis.allowToChangeInstallationDirectory = false（固定默认目录）
#     · nsis.deleteAppDataOnUninstall = false（卸载不许删用户数据）
# 🔒 冻结项

# electron-builder 三平台打包配置（macOS / Windows / Linux）
#   - 产物命名带版本与架构：DeepWhale-Desktop-<version>-<arch>.dmg / ...-x64-Setup.exe
#   - 发布目标为 GitHub Releases（draft 草稿，人工确认后公开）
#   - macOS 正式发布走 Developer ID 签名 + 公证（fail-loud 预检，见 scripts/release-preflight.js 与 RELEASING.md）
appId: com.deepwhale.desktop
productName: DeepWhale Desktop
copyright: Copyright © 2026 温州深鲸智能科技有限公司
directories:
  output: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
  # ── DSH 运行时打进 asar（而不是 extraResources 散文件）──
  #
  # 为什么：散着放是 26,444 个文件，实测写入 12.1 秒；打进 asar 后是 1 个文件、0.31 秒
  # —— 快约 40 倍，且 asar 更小（431M vs 495M，省掉文件系统块开销）。这才是"安装慢"
  # 的真正解法：Windows 上 Defender 要逐个文件扫，散文件会让安装拖到几分钟。
  #
  # 顺带干掉了一个历史 hack：electron-builder 会跳过 extraResources 里名为 node_modules
  # 的目录（即使显式 filter 也无效），所以旧方案要先把目录改名成 pkgs、打包后再由
  # after-pack 改回 node_modules。走 `files` 没有这个限制，不再需要改名。
  #
  # ⚠️ DSH 是**子进程 + ESM** 跑的，必须确认 Electron-as-Node 能从 asar 里 import ESM
  # （实测通过；普通 Node 不行，但我们用的是 Electron）。
  - dsh-runtime/**/*
# ⚠️ 2026-10-02 改为 false：Office 预览（docx/xlsx/pptx）坏在 asar 上。
#
#   libreoffice-kit 找引擎包用的是 require.resolve('<engine-pkg>/package.json')，
#   拿到的是 **asar 逻辑路径**；Electron 在 ELECTRON_RUN_AS_NODE 模式下不做
#   asar→unpacked 映射，于是 fs.statSync 返回 **0644（无执行位）**，
#   引擎自检直接抛 `Installed LibreOfficeKit executable is not executable`，
#   侧边栏只能显示「Office 预览不可用」，**日志里完全看不出原因**。
#
#   实测：asar 路径 stat=644 ❌ ／ 真实路径 stat=755 ✅ ／ 真实目录下转换成功 ✅
#   （asarUnpack 解决不了：解析出来仍是 asar 逻辑路径，已试过）
#
#   代价：安装/更新时多写约 26k 个文件（实测 +12 秒）、包体约 +15%。
#   换来的是整个运行时按真实文件运行 —— 与开发态完全一致，原生引擎不再有暗坑。
asar: false
npmRebuild: false
# 原生模块不能从 asar 里 dlopen，必须解包成真实文件。
# 实测整个运行时只有 13 个 .node，分布在下列包中；这里按包目录整体解包（比只解包
# *.node 稳，避免某些包还需要同目录的共享库/预编译产物）。
# 平台无关写法：用 `-*` 覆盖各平台后缀包名，免得漏掉某一个平台。
asarUnpack:
  - dsh-runtime/node_modules/node-pty/**
  - dsh-runtime/node_modules/@img/**
  - dsh-runtime/node_modules/@koromix/**
  - dsh-runtime/node_modules/sherpa-onnx-*/**
  - dsh-runtime/node_modules/node-addon-require-builtin-*/**
  - dsh-runtime/node_modules/@deepseek-ai/node-addon-system-*/**
  # LibreOffice 原生引擎（Office 预览 / docx·xlsx·pptx 转 PDF 用）。
  # ⚠️ 缺这两行会静默坏掉：asar 里的文件模式是 0644（没有执行位），
  #    libreoffice-kit 自检时抛 `Installed LibreOfficeKit executable is not executable`，
  #    于是侧边栏预览直接显示「Office 预览不可用」，而**日志里看不出原因** ——
  #    实测：仓库真实目录跑同一个 cli 能转出 PDF；打包后的 asar 路径必报这句。
  - dsh-runtime/node_modules/@deepseek-ai/libreoffice-kit/**
  - dsh-runtime/node_modules/@deepseek-ai/libreoffice-kit-*/**

# 法律模式载荷（约 130KB）：ui-legal-mode 插件包 + legal-mode 预设。
# 首次启动由主进程注入到应用专属 DSH home，使"任何渠道切到法律模式都拉起律师端"
# 在用户机器上生效（见 src/main/legal-mode.ts）。
extraResources:
  - from: legal-mode
    to: legal-mode
  # office 载荷：精简 CPython + 文档库（Word / Excel / PPT 生成）。
  # ⚠️ 这一份必须留在 extraResources（真实文件），不能进 asar —— Python 解释器与
  # 扩展模块要被操作系统 exec/dlopen，asar 里的文件做不到。
  # PDF 渲染由 dsh-runtime 里随 dsh 0.1.7 自带的 LibreOffice Kit 提供，不在这里。
  # 注入方式见 src/main/office-runtime.ts；`bin/node` 是壳运行时生成的包装脚本，
  # 用 Electron 充当 Node，因此不随包一份完整 Node（省约 50–90MB）。
  - from: office-runtime
    to: office-runtime
    filter:
      - '**/*'
  # 随包插件：中文合规 + 公文排版（从 npm 拉取的正式包，各 <110KB）。
  # 走标准 bundle 机制挂载，注入方式见 src/main/bundled-plugins.ts。
  - from: bundled-plugins
    to: bundled-plugins
    filter:
      - '**/*'

# 发布目标：GitHub Releases。推送 v* 标签后由 .github/workflows/release.yml 自动出包并上传草稿。
publish:
  provider: github
  releaseType: draft

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: assets/icons/icon.png
  darkModeSupport: true
  # 签名 + 公证相关（未签名构建不受影响；公证由发布脚本显式开启 --config.mac.notarize=true）
  # identity: '-' = 显式要求 ad-hoc 签名：把整个 .app（含 Resources）打上有效封印。
  # 不写这一行、又关掉证书自动发现时，产物只有 linker 签名，codesign --verify 会报
  # "code has no resources but signature indicates they must be present"，
  # 用户从浏览器下载（带 quarantine）后很可能打不开。
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: DeepWhale-Desktop-${version}-${arch}.${ext}

win:
  target:
    - nsis
  icon: assets/icons/icon.png
  artifactName: DeepWhale-Desktop-${version}-${arch}-Setup.${ext}

nsis:
  # ⚠️ 2026-10-04 事故修复（Windows 用户自动更新后"整个应用消失"）：
  #   原 oneClick:false + allowToChangeInstallationDirectory:true 是"带向导的安装器"，
  #   与 electron-updater 的**静默自动更新**不兼容：更新会把旧安装挪到 %TEMP%\...\old-install，
  #   新版本却装到另一个目录；一旦 %TEMP% 被系统/杀软清理，旧版本也没了 →
  #   用户看到"连之前装好的版本都不见了"（数据在 %APPDATA%，不受影响）。
  #   放大器：appId 曾改名（com.dsh.desktop → com.deepwhale.desktop）——NSIS 用 appId 拼
  #   注册表键记安装目录，键一变就丢失"安装目录记忆"，永远回不到原目录。
  #   → 改为 electron-builder 官方支持静默自动更新的形态：oneClick + 固定默认目录。
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepWhale Desktop

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: assets/icons/icon.png
  maintainer: feely0208
  artifactName: DeepWhale-Desktop-${version}-${arch}.${ext}
