<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深鲸 Mobile</title>
<!--
  深鲸 Mobile · 移动端界面骨架（手机端 1.1.0 · M1）
  ─────────────────────────────────────────────────────────────────────
  一次开发三端复用：iOS/Android 走 Capacitor 壳、鸿蒙走 ArkTS WebView 壳，
  三端都用这一套"为手机设计"的界面（不再是把桌面网页塞进手机）。

  按钮排布规则（**验收首位**，由 scripts/check-mobile-ui-layout.js 断言）：
    1. 主操作（发送）固定在输入区**右下角**、≥48×48，始终在拇指热区（屏幕下方 40%）；
    2. 同一行内的按钮**等高**（36px）、垂直居中（同一 y 中心 ±2px）；
    3. 任何按钮文字**不许换行**（一行放不下就整行换成可横向滚动的 chip 行）；
    4. 任何点按目标**不小于 44×44**（用 padding 撑开，视觉可以更小）；
    5. 页面**不允许横向溢出**（scrollWidth ≤ clientWidth）；
    6. 底部条/输入区必须垫 **safe-area**（刘海、home indicator、Android 手势条）。
-->
<style>
  /* ═══════════════════════════════════════════════════════════════════
     辉光视觉：**直接复用桌面端皮肤预设的 token**（src/main/skin-presets.ts）
     ───────────────────────────────────────────────────────────────────
     桌面那套是用户认可的（"桌面端的辉光效果好些"），所以手机端不再自创，
     而是同一套配方：三团 closest-side 径向光 + 固定定位 + 26s 漂移 + 深/浅两套色。
       深底 #0b1018 · 浅底 #eaf1fb
       暗色光 rgb(46,92,168) / rgb(82,146,214) / rgb(124,186,240)
       亮色光 rgb(160,197,241) / rgb(132,178,234) / rgb(190,218,248)
       尺寸 660×660 / 900×600 / 520×520（**像素**，不是百分比 —— 百分比会把光摊薄）
       动画 dsh-skin-drift 26s ease-in-out infinite alternate（respects reduced-motion）
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    --r-sm:10px; --r-md:14px; --r-lg:18px;
    --tap-min:44px; --btn-h:44px; --btn-h-primary:48px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --accent:#4a8ac4; --accent-deep:#2d5f9e;
    --danger:#e5534b; --ok:#3fb950;
    --glow:0 10px 28px rgba(74,138,196,.45), 0 2px 8px rgba(45,95,158,.35);
  }

  /* 深色（默认）：中性偏蓝的近黑底 + 三团光 */
  html,body{
    margin:0;height:100%;
    background-color:#0b1018;
    background-image:
      radial-gradient(circle closest-side at center, rgba(46,92,168,.90) 0%, rgba(46,92,168,.72) 25%, rgba(46,92,168,.432) 50%, rgba(46,92,168,.171) 75%, rgba(46,92,168,0) 100%),
      radial-gradient(circle closest-side at center, rgba(82,146,214,1.0) 0%, rgba(82,146,214,.80) 25%, rgba(82,146,214,.480) 50%, rgba(82,146,214,.190) 75%, rgba(82,146,214,0) 100%),
      radial-gradient(circle closest-side at center, rgba(124,186,240,.80) 0%, rgba(124,186,240,.64) 25%, rgba(124,186,240,.384) 50%, rgba(124,186,240,.152) 75%, rgba(124,186,240,0) 100%);
    background-size:660px 660px, 900px 600px, 520px 520px;
    background-repeat:no-repeat;
    background-position:calc(10vw - 80px) calc(100% + 60px), calc(50vw - 450px) calc(100% + 40px), calc(90vw - 460px) calc(100% + 70px);
    background-attachment:fixed;
    animation:dsh-skin-drift 26s ease-in-out infinite alternate;
    color:#e8ecf2;
    font:15px/1.55 -apple-system,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  /* 浅色：同配方换色 */
  @media (prefers-color-scheme: light){
    html,body{
      background-color:#eaf1fb;
      background-image:
        radial-gradient(circle closest-side at center, rgba(160,197,241,.90) 0%, rgba(160,197,241,.72) 25%, rgba(160,197,241,.432) 50%, rgba(160,197,241,.171) 75%, rgba(160,197,241,0) 100%),
        radial-gradient(circle closest-side at center, rgba(132,178,234,.95) 0%, rgba(132,178,234,.76) 25%, rgba(132,178,234,.456) 50%, rgba(132,178,234,.181) 75%, rgba(132,178,234,0) 100%),
        radial-gradient(circle closest-side at center, rgba(190,218,248,.80) 0%, rgba(190,218,248,.64) 25%, rgba(190,218,248,.384) 50%, rgba(190,218,248,.152) 75%, rgba(190,218,248,0) 100%);
      color:#16202c;
    }
  }
  @keyframes dsh-skin-drift{
    from{background-position:calc(10vw - 80px) calc(100% + 60px), calc(50vw - 450px) calc(100% + 40px), calc(90vw - 460px) calc(100% + 70px)}
    to{background-position:calc(10vw - 44px) calc(100% + 74px), calc(50vw - 512px) calc(100% + 54px), calc(90vw - 424px) calc(100% + 58px)}
  }
  @media (prefers-reduced-motion: reduce){ html,body{animation:none} }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 按钮基底：**必须显式给底色** —— 漏掉就会渲染成浏览器默认的白底（实测"新建会话"变白块） */
  button{font:inherit;color:inherit;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);cursor:pointer}
  @media (prefers-color-scheme: light){ button{background:rgba(255,255,255,.62);border-color:rgba(20,40,70,.10)} }
  body{display:flex;flex-direction:column;overflow-x:hidden}
  /* 自上而下压暗：把辉光留在下方，顶部留出层次（手机竖屏比桌面窗口高得多） */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(to bottom, rgba(11,16,24,.88) 0%, rgba(11,16,24,.45) 38%, rgba(11,16,24,0) 72%)}
  @media (prefers-color-scheme: light){
    body::before{background:linear-gradient(to bottom, rgba(234,241,251,.92) 0%, rgba(234,241,251,.5) 38%, rgba(234,241,251,0) 72%)}
  }
  .app{position:relative;z-index:1}
  .app{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column;
    min-height:0;padding-top:var(--safe-t)}

  /* ── 玻璃面板（辉光透出来，而不是盖死） ─────────────────────── */
  .glass{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
    -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15)}
  @media (prefers-color-scheme: light){
    .glass{background:rgba(255,255,255,.62);border-color:rgba(20,40,70,.10)}
  }

  /* ── 顶部 ───────────────────────────────────────────────────── */
  .top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(12,17,25,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);flex-wrap:nowrap}
  @media (prefers-color-scheme: light){ .top{background:rgba(255,255,255,.55);border-bottom-color:rgba(20,40,70,.08)} }
  .ws{display:inline-flex;align-items:center;gap:7px;height:var(--tap-min);padding:0 14px;
    border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);
    font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw;flex:0 1 auto}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;
    box-shadow:0 0 10px rgba(63,185,80,.9)}
  .grow{flex:1 1 auto}
  .icon-btn{width:var(--tap-min);height:var(--tap-min);display:inline-flex;align-items:center;
    justify-content:center;border:0;background:transparent;color:inherit;border-radius:var(--r-sm);flex:0 0 auto}

  /* ── 内容 ───────────────────────────────────────────────────── */
  .scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;min-height:0}
  .search{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;margin:14px;
    border-radius:var(--r-md);font-size:14px;opacity:.9}

  /* 会话列表 */
  .new-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:var(--btn-h-primary);
    margin:0 14px 14px;width:calc(100% - 28px);border-radius:var(--r-md);color:inherit;font-size:15px;font-weight:600}
  .row-btn{display:flex;width:100%;align-items:center;gap:10px;min-height:64px;padding:12px 16px;
    background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.06);color:inherit;text-align:left}
  @media (prefers-color-scheme: light){ .row-btn{border-bottom-color:rgba(20,40,70,.07)} }
  .row-btn .t{flex:1 1 auto;min-width:0}
  .row-btn .title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px;font-weight:500}
  .row-btn .sub{display:block;font-size:12px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row-btn .time{font-size:12px;opacity:.5;flex:0 0 auto}

  /* 会话页 */
  .tabs{display:flex;align-items:center;gap:8px;padding:12px 14px}
  .tab{flex:1 1 0;height:var(--btn-h);border-radius:999px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10);color:inherit;font-size:14px;white-space:nowrap;min-width:0;opacity:.72}
  .tab[aria-selected="true"]{opacity:1;font-weight:600;border-color:rgba(124,186,240,.45);
    background:rgba(124,186,240,.14);box-shadow:0 0 18px rgba(82,146,214,.25) inset}
  .msg{margin:12px 14px;padding:12px 14px;border-radius:var(--r-md);word-break:break-word;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
  .msg.me{background:linear-gradient(160deg, rgba(74,138,196,.30), rgba(45,95,158,.22));
    border-color:rgba(124,186,240,.35);margin-left:46px}
  .meta{font-size:12px;opacity:.6;display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  pre{margin:10px 0 0;padding:11px 12px;border-radius:var(--r-sm);overflow-x:auto;font-size:12.5px;
    background:rgba(6,10,16,.62);border:1px solid rgba(255,255,255,.07);line-height:1.6}

  /* 审批卡：拒绝=描边危险色，允许=辉光主操作 */
  .approval{margin:12px 14px;padding:14px;border-radius:var(--r-md);
    border:1px solid rgba(229,83,75,.32);background:linear-gradient(160deg, rgba(229,83,75,.10), rgba(229,83,75,.03))}
  .approval .acts{display:flex;gap:12px;margin-top:12px}
  .btn{height:var(--btn-h);padding:0 16px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:inherit;font-size:14.5px;white-space:nowrap;display:inline-flex;
    align-items:center;justify-content:center;gap:6px}
  .btn.grow{flex:1 1 0;min-width:0}
  .btn.danger{border-color:rgba(229,83,75,.55);color:#ffb9b4;background:transparent}
  .btn.primary{border-color:transparent;color:#f2f8ff;font-weight:600;
    background:linear-gradient(180deg,#5c9ad4,#2d5f9e);box-shadow:var(--glow)}

  /* ── 输入区 ─────────────────────────────────────────────────── */
  .composer{border-top:1px solid rgba(255,255,255,.08);background:rgba(12,17,25,.58);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:10px 14px}
  @media (prefers-color-scheme: light){ .composer{background:rgba(255,255,255,.60);border-top-color:rgba(20,40,70,.08)} }
  .chips-wrap{position:relative}
  /* chip 行**换行**而不是横向滚动：滚动 + 右缘渐隐在玻璃层上会变成一块难看的深色方块（实测） */
  .chips{display:flex;flex-wrap:wrap;gap:9px;padding-bottom:10px}
  .chip{height:var(--tap-min);padding:0 15px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.11);color:inherit;font-size:13.5px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;opacity:.88}
  .input-row{display:flex;align-items:flex-end;gap:12px}
  textarea{flex:1 1 auto;min-width:0;min-height:var(--btn-h-primary);max-height:120px;resize:none;
    padding:12px 14px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.10);
    background:rgba(255,255,255,.05);color:inherit;font:inherit;font-size:15px}
  textarea::placeholder{color:currentColor;opacity:.42}
  .send{flex:0 0 auto;width:var(--btn-h-primary);height:var(--btn-h-primary);border-radius:50%;
    border:0;color:#f4f9ff;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#5c9ad4,#2d5f9e);box-shadow:var(--glow)}
  .icon-44{width:var(--btn-h-primary);height:var(--btn-h-primary);flex:0 0 auto;border-radius:var(--r-sm);
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:inherit;
    display:inline-flex;align-items:center;justify-content:center}

  /* ── 底部标签栏 ─────────────────────────────────────────────── */
  .tabbar{display:flex;border-top:1px solid rgba(255,255,255,.08);
    background:rgba(12,17,25,.62);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    padding-bottom:var(--safe-b)}
  @media (prefers-color-scheme: light){ .tabbar{background:rgba(255,255,255,.62);border-top-color:rgba(20,40,70,.08)} }
  .tabbar button{flex:1 1 0;min-width:0;height:58px;border:0;background:transparent;color:inherit;
    opacity:.62;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11px;white-space:nowrap}
  .tabbar button[aria-current="page"]{opacity:1;color:#9ecbf5}
  .tabbar .ic{width:22px;height:22px;display:block}

  /* 图标统一描边（**全局**）：只写在 .tabbar 里会让顶部图标被填成黑块（实测） */
  .ic path,.ic circle,.ic rect{fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部 -->
  <header class="top">
    <button class="ws" id="ws-chip"><span class="dot"></span>未分组 · 本机</button>
    <span class="grow"></span>
    <button class="icon-btn" id="btn-refresh" aria-label="刷新"><svg class="ic" viewBox="0 0 24 24" width="20" height="20"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    <button class="icon-btn" id="btn-settings" aria-label="设置"><svg class="ic" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
  </header>

  <!-- 会话列表页 -->
  <main class="scroll" id="page-list">
    <div class="search">🔍 搜索会话内容</div>
    <button class="new-btn" id="btn-new">＋ 新建会话</button>
    <button class="row-btn" data-id="s1">
      <span class="t"><span class="title">创建每日新闻定时推送任务</span><span class="sub">session-7929b8cc</span></span>
      <span class="time">3 分钟前</span>
    </button>
    <button class="row-btn" data-id="s2">
      <span class="t"><span class="title">服务器介绍</span><span class="sub">session-2f5899d4</span></span>
      <span class="time">7 分钟前</span>
    </button>
    <button class="row-btn" data-id="s3">
      <span class="t"><span class="title">验证活动页布局</span><span class="sub">session-d7609b3a</span></span>
      <span class="time">2 周前</span>
    </button>
  </main>

  <!-- 会话页（默认隐藏，供断言/联调切换） -->
  <main class="scroll" id="page-chat" hidden>
    <div class="tabs"><button class="icon-btn" id="btn-back" aria-label="返回"><svg class="ic" viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="tab" id="tab-chat" aria-selected="true">对话</button>
      <button class="tab" id="tab-trace" aria-selected="false">轨迹</button>
    </div>
    <div class="msg me">给我创建一个定时任务，明早 8 点推送当天科技与财经新闻。</div>
    <div class="msg">
      <div>定时任务已创建 ✅</div>
      <pre>| 触发时间 | 2026-10-16 08:00 (Asia/Shanghai) |
| 任务名   | 每日科技+财经新闻早报 |</pre>
      <div class="meta"><span>耗时 3 秒</span><span>2 项上下文</span><span>1 次工具调用</span></div>
    </div>
    <div class="approval" id="approval-card">
      <div>Agent 请求执行 <b>bash</b>：<code>rm -rf build/</code></div>
      <div class="acts">
        <button class="btn grow danger" id="btn-deny">拒绝</button>
        <button class="btn grow primary" id="btn-allow">允许</button>
      </div>
    </div>
  </main>

  <!-- 输入区 + 标签栏 -->
  <div class="composer">
    <div class="chips-wrap"><div class="chips" id="chips">
      <button class="chip" id="chip-attach">📎 附件</button>
      <button class="chip" id="chip-ws">未分组</button>
      <button class="chip" id="chip-model">DeepSeek-V4</button>
      <button class="chip" id="chip-effort">High</button>
    </div></div>
    <div class="input-row">
      <button class="icon-44" id="btn-plus" aria-label="更多"><svg class="ic" viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="input" rows="1" placeholder="描述你想要构建的内容"></textarea>
      <button class="send" id="btn-send" aria-label="发送"><svg class="ic" viewBox="0 0 24 24" width="20" height="20"><path d="M5 4l14 8-14 8z" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </div>
  <nav class="tabbar">
    <button id="nav-chat" aria-current="page"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg>会话</button>
    <button id="nav-tasks"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>任务</button>
    <button id="nav-plugins"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/></svg>插件</button>
    <button id="nav-me"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>我的</button>
  </nav>
</div>
<script>
  // 仅用于骨架/断言联调：切换两个主页面
  window.__dshMobile = {
    showPage(name){
      document.getElementById('page-list').hidden = name !== 'list';
      document.getElementById('page-chat').hidden = name !== 'chat';
      document.querySelectorAll('.tabbar button').forEach((b)=>b.removeAttribute('aria-current'));
      document.getElementById(name === 'list' ? 'nav-chat' : 'nav-chat').setAttribute('aria-current','page');
    },
  };
  document.getElementById('nav-chat').addEventListener('click',()=>window.__dshMobile.showPage('chat'));
  document.getElementById('nav-me').addEventListener('click',()=>window.__dshMobile.showPage('list'));
</script>
</body>
</html>
