# @deepwhale-cn/dsh-shell-canvas 的组合层
#
# profile 在 dsh.profile.bundles 里列出本包后，这一层把插件挂进组合。
#
# 约定（官方 verify-cordis-config 强制）：每个具名行都必须能从本包自己的
# 作用域解析。这里 name 写的就是本包已发布的包名 —— 加载器按这个 specifier 导入，
# 所以它必须与 package.json 的 name 完全一致。
#
# 本包的宿主半边**不是空的**（与 shell-session-actions / shell-document-print 不同）：
# 它要在 ctx.webServer 上挂一个 /dsh-canvas 前缀路由，用来列模板、跑校验、
# 起渲染子进程、推进度、把成片交给浏览器播。客户端半边只是这个出口的界面。
- insert:
    - id: shell-canvas
      name: '@deepwhale-cn/dsh-shell-canvas'
