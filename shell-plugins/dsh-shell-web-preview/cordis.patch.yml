# @deepwhale-cn/dsh-shell-web-preview 的组合层
#
# 本包做两件事：
#
#   ① 把官方 `ui-sidebar-browser` 那一条的 `disabled` 覆盖成 false（右栏才能开网页）。
#      官方默认关它的原因见 @deepseek-ai/dsh-web-app/cordis.patch.yml：
#      `disabled: profileContext?.name !== 'desktop'`，而我们的 profile 不叫 desktop
#      （那个名字被官方 Electron 宿主保留，用它会直接被 rejectElectronProfile() 挡掉），
#      所以那个条件恒为 true。**不能靠改 profile 名解决** —— 同一个 name === 'desktop'
#      条件还开着官方遥测与埋点，那是红线。
#
#   ② 插入本包自己的一行。**这一行是客户端半边的触发条件**：
#      @deepseek-ai/dsh-client-modules 只扫描「活动 loader 行」对应的包，
#      挂上本行后才会把 `./client` 出口下发给浏览器（见 lib/client.js）。
#      官方 verify-cordis-config 要求：name 必须与本包 package.json 的 name 完全一致。
- id: ui-sidebar-browser
  name: '@deepseek-ai/dsh-client-ui-sidebar-browser'
  disabled: false

- insert:
    - id: shell-web-preview
      name: '@deepwhale-cn/dsh-shell-web-preview'
