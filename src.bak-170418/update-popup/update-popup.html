<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- ⚠️ 必须允许 'self'：弹窗的 css/js 就是同目录文件。
         第一版写成 default-src 'none' + 只放行 inline → 自己的样式与脚本被拦，
         弹窗渲染成"裸 HTML"（2026-10-04 实测，截图一眼就看出来）。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>深鲸桌面更新</title>
    <link rel="stylesheet" href="./update-popup.css" />
  </head>
  <body>
    <div class="stage">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="card">
        <header class="head">
          <!-- 标记用我们的「青色大肥鱼」（取自宠物精灵图 idle 首帧，见 assets/brand/whale-pet.png） -->
          <div class="mark" aria-hidden="true">
            <img src="../assets/brand/whale-pet.png" alt="" width="46" height="40" />
          </div>
          <div class="titles">
            <div class="eyebrow" id="eyebrow">正在下载更新</div>
            <h1 id="title">深鲸桌面</h1>
            <div class="sub" id="subtitle"></div>
          </div>
          <button class="x" id="btn-close" title="关闭">✕</button>
        </header>

        <section class="progress" id="progress-wrap">
          <div class="bar"><span class="fill" id="fill"></span><span class="sweep"></span></div>
          <div class="pct"><span id="pct">0%</span><span class="hint" id="speed"></span></div>
          <div class="status" id="status">正在下载安装包…</div>
        </section>

        <section class="notes">
          <div class="notes-head">
            <span id="notes-title">本版更新内容</span>
            <span class="tag" id="notes-tag"></span>
          </div>
          <ul id="items"></ul>
          <div class="empty" id="notes-empty" hidden>本版暂无更新说明。</div>
        </section>

        <footer class="foot">
          <!-- 2026-10-14：更新由用户掌控 —— 发现新版本时先给「现在更新」，
               下载中可以「停止更新」（真停，不是只关窗），不想更新可以「这个版本不再提醒」。 -->
          <!-- ⚠️ 2026-10-15：**必须是一行**（原来拆成上下两行：左上一排次要按钮、
               右下一排主按钮，实测「发现新版本」屏主按钮孤零零在右下，两行高度还差 2px）。
               现在：左槽只放"中断类"动作（停止更新），右槽右对齐放其余，主按钮永远在最右。 -->
          <div class="foot-left">
            <button class="ghost" id="btn-stop" hidden>停止更新</button>
          </div>
          <div class="foot-right">
            <button class="ghost" id="btn-skip" hidden>这个版本不再提醒</button>
            <button class="ghost" id="btn-later">稍后</button>
            <button class="primary" id="btn-update" hidden>现在更新</button>
            <button class="primary" id="btn-restart" disabled>下载中…</button>
          </div>
        </footer>
        <div class="fineprint" id="fineprint">深鲸桌面 · 本地运行 · 不上传你的文件</div>
      </div>
    </div>
    <script src="./update-popup.js"></script>
  </body>
</html>
