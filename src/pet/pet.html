<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file: data:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' file:"
  />
  <title>dsh pet</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="pet" class="pet" title="右键菜单">
    <div class="pet-stage">
      <!-- 默认宠物：Codex 风格橙色小团子（SVG + CSS 动画，无需外部素材） -->
      <svg id="default-pet" class="pet-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="blob-grad" cx="38%" cy="32%" r="80%">
            <stop offset="0%" stop-color="#ffb37a" />
            <stop offset="55%" stop-color="#ff8a3d" />
            <stop offset="100%" stop-color="#f26b1d" />
          </radialGradient>
        </defs>

        <!-- 小短手 -->
        <ellipse class="arm" cx="17" cy="58" rx="6" ry="9" fill="#f26b1d" />
        <ellipse class="arm" cx="83" cy="58" rx="6" ry="9" fill="#f26b1d" />

        <!-- 身体（豆形团子） -->
        <path class="body" d="M50 13 C72 13 91 31 91 52 C91 74 72 91 50 91 C28 91 9 74 9 52 C9 31 28 13 50 13 Z" fill="url(#blob-grad)" />

        <!-- 腮红 -->
        <ellipse class="cheek" cx="28" cy="60" rx="5" ry="3" fill="#ffb27d" opacity="0.65" />
        <ellipse class="cheek" cx="72" cy="60" rx="5" ry="3" fill="#ffb27d" opacity="0.65" />

        <!-- 眼睛 + 高光 -->
        <g class="eye" fill="#3a2418">
          <ellipse cx="38" cy="48" rx="4.6" ry="5.6" />
          <ellipse cx="62" cy="48" rx="4.6" ry="5.6" />
        </g>
        <circle class="eye-glow" cx="40" cy="45.5" r="1.6" fill="#ffffff" />
        <circle class="eye-glow" cx="64" cy="45.5" r="1.6" fill="#ffffff" />

        <!-- 微笑 -->
        <path d="M44 61 Q50 68 56 61" stroke="#3a2418" stroke-width="3" stroke-linecap="round" fill="none" />

        <!-- 小脚 -->
        <ellipse cx="38" cy="88" rx="7" ry="3.4" fill="#d95d1a" />
        <ellipse cx="62" cy="88" rx="7" ry="3.4" fill="#d95d1a" />
      </svg>

      <!-- 地面阴影（随弹跳伸缩） -->
      <div class="pet-shadow"></div>
    </div>

    <!-- 自定义宠物（assets/pets/ 下的 .gif 或 .svg，来自主进程 query 参数） -->
    <img id="custom-pet" class="pet-custom" alt="pet" hidden />
  </div>
  <script src="pet.js"></script>
</body>
</html>
