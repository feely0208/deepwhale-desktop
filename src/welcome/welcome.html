<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' file:"
  />
  <title>欢迎使用深鲸壳</title>
  <style>
    body {
      margin: 0;
      padding: 24px 26px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f8fa;
      color: #24292f;
      -webkit-user-select: none;
      user-select: none;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p.desc { font-size: 12.5px; color: #57606a; margin: 0 0 16px; line-height: 1.7; }
    ul.ready { list-style: none; padding: 0; margin: 0 0 18px; }
    ul.ready li {
      font-size: 12.5px;
      line-height: 1.9;
      color: #24292f;
    }
    ul.ready li::before { content: '✓'; color: #1a7f37; font-weight: 700; margin-right: 7px; }
    .section {
      border-top: 1px solid #e4e7ec;
      padding-top: 14px;
      margin-top: 4px;
    }
    .label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .hint { font-size: 11.5px; color: #8b949e; margin: 0 0 10px; line-height: 1.7; }
    .status { font-size: 12px; color: #1a7f37; min-height: 16px; margin-top: 8px; }
    .row { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    button {
      padding: 7px 15px;
      border-radius: 6px;
      border: 1px solid #d0d7de;
      background: #ffffff;
      color: #24292f;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #eef0f4; }
    button.primary { background: #4d7cfe; border-color: #4d7cfe; color: #fff; }
    button.primary:hover { background: #3d6cf5; }
  <style media="(prefers-color-scheme: dark)">
    body { background: #16181d; color: #e6e8ec; }
    p.desc, .hint { color: #9aa1ad; }
    ul.ready li { color: #e6e8ec; }
    .section { border-top-color: #23262e; }
    button { background: #1d2128; color: #e6e8ec; border-color: #2a2f3a; }
    button:hover { background: #262b34; }
    button.primary { background: #4d7cfe; border-color: #4d7cfe; color: #fff; }
  </style>
  </style>
</head>
<body>
  <h1>欢迎使用深鲸壳</h1>
  <p class="desc">
    深鲸壳是 DeepSeek Harness 的桌面客户端，安装包已内置完整运行时——<br />
    无需另外安装 Node.js、无需联网下载依赖，装完即用。
  </p>

  <ul class="ready">
    <li>DSH 运行时已内置，开箱可用</li>
    <li>法律模式联动已就绪（切到法律模式即拉起律师端）</li>
    <li>你的数据保存在本机，我们无法获取</li>
  </ul>

  <div class="section">
    <div class="label">DeepSeek API Key（可选）</div>
    <p class="hint">
      配置后即可使用 AI 能力，Key 会用系统钥匙串加密保存在本机。<br />
      现在跳过也没关系，之后可在 DSH 界面的「设置」里随时配置。
    </p>
    <div class="row" style="justify-content: flex-start; margin-top: 10px;">
      <button id="setkey">配置 API Key…</button>
    </div>
    <div class="status" id="keystatus"></div>
  </div>

  <div class="row">
    <button id="start" class="primary">开始使用</button>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
